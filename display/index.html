<!doctype html>
<html data-keep-awake lang="en" data-theme-lock="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<title>Big Screen · JA Scoring</title>
<link rel="stylesheet" href="../css/theme.css?v=20261112f">
<script src="../js/theme.js?v=20261112f"></script>
<style>
:root{--sport:#B3162D;--bg:#16181D;--card:#23262E;--line:#343844;--text:#F2F3F5;--muted:#9A9FAA;--gold:#D2AC70}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body.transparent,html:has(body.transparent){background:transparent}
.wrap{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto auto}
.cond{font-family:Rajdhani,Inter,sans-serif}

/* top bar */
.bar{display:flex;align-items:center;gap:1.4vw;padding:.9vw 2vw;background:linear-gradient(110deg,#8E1325,#4C0B16 60%,#1C1E24);border-bottom:.25vw solid var(--sport);color:#fff}
.bar .lg{width:4.2vw;height:4.2vw;border-radius:50%;object-fit:cover;box-shadow:0 0 0 .2vw #ffffff33}
.bar .org{height:2.2vw;width:auto}
.bar .ev{font-size:2vw;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.bar .venue{font-size:1vw;color:#ffffffb3}
.bar .sp{flex:1}
.bar .now{font-size:1.9vw;font-weight:800;font-variant-numeric:tabular-nums}
.sportchip{font-size:1.7vw;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:.35vw 1.2vw;border-radius:.5vw;background:var(--sport);color:#fff}
.dots{display:flex;gap:.4vw}
.dots i{width:.7vw;height:.7vw;border-radius:50%;background:#ffffff33}
.dots i.on{background:#fff}

/* main */
main{padding:1.4vw 2vw;display:grid;grid-template-columns:1fr 26vw;gap:1.4vw;min-height:0}
main.solo{grid-template-columns:1fr}
.col h2{margin:0 0 .8vw;font-size:1.3vw;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:.6vw}
.col h2 .live{background:#E0364F;color:#fff;border-radius:.3vw;padding:.1vw .6vw;font-size:1vw;letter-spacing:.1em;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.grid{display:grid;gap:1vw;grid-template-columns:repeat(var(--cols,2),1fr);align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-left:.4vw solid var(--sport);border-radius:1vw;padding:1vw 1.3vw;min-width:0;box-shadow:0 .4vw 1.2vw #0000004d}
.card .meta{display:flex;gap:1vw;font-size:1vw;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card .meta .st{margin-left:auto;color:var(--gold);font-weight:800}
.trow{display:grid;grid-template-columns:1.2vw 1fr auto auto;align-items:center;gap:.8vw;margin-top:.5vw}
.trow .srv{width:.8vw;height:.8vw;border-radius:50%;background:transparent}
.trow .srv.on{background:var(--gold);box-shadow:0 0 .8vw var(--gold)}
.trow .nm{font-size:var(--nm,2.2vw);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sm{font-size:calc(var(--nm,2.2vw)*.7);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-width:2vw;text-align:center}
.trow .bg{font-size:var(--big,3.6vw);font-weight:900;font-variant-numeric:tabular-nums;min-width:4.6vw;text-align:right;line-height:1}
.trow .nm .pl{display:block;font-size:.5em;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.trow.win .nm{color:var(--gold)}
.trow.win .bg{color:#FF4D63}
.tag{display:inline-block;background:var(--gold);color:#000;font-size:.8vw;font-weight:900;border-radius:.3vw;padding:.05vw .5vw;margin-left:.6vw;vertical-align:middle}
.hist{margin-top:.5vw;font-size:1vw;color:var(--muted);font-variant-numeric:tabular-nums}
.clk{font-variant-numeric:tabular-nums}

/* bowling team table */
.bw{display:grid;gap:.5vw;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,11),auto);align-content:start}
.bw.two{grid-template-columns:1fr 1fr;column-gap:1.2vw}
.bw-r{display:grid;grid-template-columns:2.6vw 1fr auto 6vw;align-items:center;gap:1vw;background:var(--card);border:1px solid var(--line);border-left:.4vw solid var(--sport);border-radius:.7vw;padding:.42vw 1.2vw;min-width:0}
.bw-p{font-size:1.7vw;font-weight:900;color:var(--muted);text-align:center}
.bw-r:nth-child(1) .bw-p{color:var(--gold)}
.bw-n{font-size:1.8vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bw-g{font-size:.95vw;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.bw-r.fin .bw-g{color:var(--gold)}
.bw-t{font-size:2.1vw;font-weight:900;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
/* side lists */
.list .it{display:grid;grid-template-columns:auto 1fr auto;gap:.8vw;align-items:center;padding:.6vw .8vw;border-bottom:1px solid var(--line);font-size:1.15vw}
.list .it .n{color:var(--muted);font-weight:700;font-size:.95vw;white-space:nowrap}
.list .it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.list .it .t b{color:var(--gold)}
.list .it .s{font-weight:900;font-variant-numeric:tabular-nums}
.list + h2{margin-top:1.4vw}
.empty{color:var(--muted);font-size:1.3vw;padding:1vw 0}
.card[style*="--cc"]{border-left-color:var(--cc)}
.card .meta{flex-wrap:wrap;row-gap:.35vw;align-items:center}
.card .meta>span{white-space:nowrap}
.card .meta .ctb{background:var(--text,#ECEDEF);color:var(--bg,#16181d);border-radius:.4vw;padding:0 .6vw;font-weight:900;letter-spacing:.06em}
.card .meta .evc{color:var(--cc,var(--muted));font-weight:800}
.card .meta .ptb{background:linear-gradient(120deg,#D2AC70,#9a7442);color:#16181d;border-radius:.4vw;padding:0 .6vw;font-weight:900;letter-spacing:.12em}
.grid.courts{grid-auto-rows:1fr}
.card.idle{display:flex;flex-direction:column;opacity:.85;border-left-color:var(--line)}
.card.idle .idlebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vw;text-align:center;color:var(--muted);font-size:1.2vw;font-weight:700;padding:1vw 0}
.card.idle .idlebox b{color:var(--text,#ECEDEF);font-size:calc(var(--nm,2.2vw)*.9)}
.card.idle .idlebox i{font-style:normal;color:var(--cc,var(--muted));font-size:1vw;letter-spacing:.08em}

/* featured */
.feat{display:flex;flex-direction:column;justify-content:center;height:100%;gap:1.5vw}
.feat .meta{font-size:1.6vw;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;text-align:center}
.feat .st{font-size:2.2vw;color:var(--gold);font-weight:900;text-align:center;text-transform:uppercase}
.feat .trow{grid-template-columns:2vw 1fr auto auto;--nm:5vw;--big:11vw;background:var(--card);border-radius:1vw;padding:1vw 2vw;border-left:.6vw solid var(--sport)}
.feat .trow .srv{width:1.4vw;height:1.4vw}
.feat .trow .sm{min-width:6vw}
.feat .hist{text-align:center;font-size:1.8vw}
.feat .tag{font-size:1.4vw}

/* scorer announcements */
.ann{display:flex;align-items:stretch;background:#F2B544;color:#1C1E24;min-height:4.4vw;overflow:hidden}
.ann[hidden]{display:none}
.ann .al{display:flex;align-items:center;gap:.7vw;padding:0 1.6vw;background:var(--ac,#B3162D);color:#fff;font-weight:900;font-size:1.5vw;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ann .at{flex:1;display:flex;align-items:center;padding:.5vw 1.8vw;font-weight:800;font-size:2.1vw;line-height:1.15;animation:annin .45s both}
.ann .an{display:flex;align-items:center;padding:0 1.4vw;font-weight:800;font-size:1.1vw;opacity:.6;white-space:nowrap}
@keyframes annin{from{opacity:0;transform:translateY(.8vw)}to{opacity:1;transform:none}}
/* ticker */
.tick{display:flex;align-items:center;background:#111317;border-top:1px solid var(--line);height:3.4vw;overflow:hidden}
.tick .ja{display:flex;align-items:center;gap:.6vw;padding:0 1.4vw;color:#ffffff80;font-size:.8vw;letter-spacing:.2vw;font-weight:600;white-space:nowrap}
.tick .ja .jamark{width:2vw;height:1.2vw}
.tick .lbl{background:#B3162D;color:#fff;font-weight:900;font-size:1.2vw;padding:0 1.2vw;height:100%;display:flex;align-items:center;letter-spacing:.1em;white-space:nowrap}
.tick .mq{flex:1;overflow:hidden;white-space:nowrap}
.tick .mq span{display:inline-block;padding-left:100%;font-size:1.3vw;font-weight:600;animation:mq var(--dur,40s) linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.setup{position:absolute;inset:0;display:grid;place-items:center;font-size:2vw;color:var(--muted)}
/* prize giving */
.aw-wrap{height:100%;display:flex;flex-direction:column;gap:1.4vw}
.aw-title{margin:0;font-size:2.6vw;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--gold)}
.aw-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:1.2vw;align-content:start}
.aw-card{min-width:0;background:var(--card);border:1px solid var(--line);border-top:.35vw solid var(--c);border-radius:1vw;padding:1vw 1.3vw;animation:awin .6s both;box-shadow:0 .4vw 1.2vw #0000004d}
.aw-cat{font-size:1.5vw;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.6vw}
.aw-row{display:flex;align-items:center;gap:.9vw;padding:.35vw 0}
.aw-m{width:2.2vw;height:2.2vw;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.1vw;color:#fff;flex:none}
.aw-row.p1 .aw-m{background:#D2AC70;box-shadow:0 0 1vw #D2AC7066}.aw-row.p2 .aw-m{background:#A7AEB8}.aw-row.p3 .aw-m{background:#B07A4A}
.aw-n{font-weight:800;font-size:1.6vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw-row.p1 .aw-n{font-size:2vw;color:#fff}
.aw-grid.many{gap:1vw;margin-top:1vw}.aw-grid.many .aw-card{padding:1.4vw 1.1vw 1.6vw}.aw-grid.many .aw-cat{font-size:1.25vw;margin-bottom:1vw}.aw-grid.many .aw-row{padding:.6vw 0;gap:.7vw}.aw-grid.many .aw-n{font-size:1.3vw;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.aw-grid.many .aw-row.p1 .aw-n{font-size:1.55vw}
.aw-empty{display:grid;place-items:center;height:100%;font-size:3vw;color:var(--muted);font-weight:700}
@keyframes awin{from{opacity:0;transform:translateY(1.5vw)}to{opacity:1;transform:none}}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:3vw;margin-top:1.2vw;font-size:1.5vw;color:var(--muted);text-align:left}
.evs span{display:block;line-height:1.5}.evs i{font-style:normal;opacity:.7}.evs>div:last-child{text-align:right}
.feat.hasev{gap:1vw}.feat.hasev .trow{--nm:4vw;--big:7.5vw;padding:.4vw 2vw}.feat.hasev .evs{margin-top:.2vw;padding:0 2.6vw;font-size:1.45vw}
#goal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;min-width:52vw;max-width:86vw;text-align:center;background:linear-gradient(160deg,#16181dF2,#0b0c0fF2);border:.25vw solid var(--gc,#16a34a);border-radius:2vw;padding:2.2vw 3.5vw;box-shadow:0 2vw 6vw #000c;animation:goalin .45s cubic-bezier(.2,.9,.3,1.2) both;color:#fff}
#goal .gk{font-size:5.5vw;font-weight:700;letter-spacing:.08em;color:var(--gc,#16a34a);line-height:1}
#goal .gs{font-size:2.6vw;font-weight:700;margin-top:1vw;text-wrap:balance}#goal .gs b{color:#D2AC70;margin:0 .8vw}
#goal .gn{font-size:2.2vw;margin-top:.8vw;font-weight:700}
#goal .gp{font-size:1.3vw;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-top:1vw}
@keyframes goalin{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* ---------- lively bits (only with body.fx; add ?fx=off to the link for a still screen) ---------- */
.rot{display:none}
#fin{position:fixed;right:2vw;top:7.6vw;z-index:35;max-width:36vw;background:linear-gradient(160deg,#1c1f26f7,#0e0f12f7);border-left:.45vw solid var(--fc,#B3162D);border-radius:.9vw;padding:.9vw 1.7vw 1vw;box-shadow:0 1vw 3vw #000a;color:#fff;animation:finin .5s cubic-bezier(.2,.9,.3,1.1) both}
#fin[hidden]{display:none}
#fin .fk{font-size:1.1vw;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
#fin .fs{font-size:2vw;font-weight:700;line-height:1.2;margin-top:.2vw}#fin .fs b{color:var(--gold);margin:0 .5vw}
#fin .fw{font-size:1.35vw;font-weight:700;margin-top:.2vw}
@keyframes finin{from{opacity:0;transform:translateX(6vw)}to{opacity:1;transform:none}}
.confetti{display:none}
body.fx .wrap{isolation:isolate}body.fx main{position:relative}
body.fx:not(.transparent) .wrap::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 22% 30%,color-mix(in srgb,var(--sport) 24%,transparent),transparent 40%),radial-gradient(circle at 78% 72%,color-mix(in srgb,var(--sport) 15%,transparent),transparent 44%);
  animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-6%,-4%) rotate(0deg)}to{transform:translate(6%,5%) rotate(8deg)}}
body.fx .bar{position:relative;overflow:hidden}
body.fx .bar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:20vw;pointer-events:none;background:linear-gradient(100deg,transparent,#ffffff1c,transparent);transform:translateX(-25vw);animation:shine 10s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-25vw)}100%{transform:translateX(105vw)}}
body.fx .bar .lg{animation:ring 3.2s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 .2vw #ffffff33}50%{box-shadow:0 0 0 .2vw #ffffff66,0 0 1.6vw .2vw color-mix(in srgb,var(--sport) 70%,transparent)}}
body.fx .rot{display:block;position:absolute;left:0;bottom:0;height:.22vw;width:0;background:#ffffffa6;transition:width .5s linear}
body.fx .sportchip{transition:background .5s}
body.fx .sportchip.pop{animation:chip .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes chip{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
body.fx .dots i{transition:background .4s,transform .4s}body.fx .dots i.on{transform:scale(1.35)}
body.fx main.enter :is(.card,.bw-r,.it,.empty,.aw-card),body.fx main.enter .col>h2,body.fx main.enter .feat>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
body.fx main.enter :is(.card,.bw-r,.it,.feat>*):nth-child(2){animation-delay:.07s}body.fx main.enter :is(.card,.bw-r,.it,.feat>*):nth-child(3){animation-delay:.14s}
body.fx main.enter :is(.card,.bw-r,.it,.feat>*):nth-child(4){animation-delay:.21s}body.fx main.enter :is(.card,.bw-r,.it,.feat>*):nth-child(5){animation-delay:.28s}
body.fx main.enter :is(.card,.bw-r,.it):nth-child(6){animation-delay:.35s}body.fx main.enter :is(.card,.bw-r,.it):nth-child(7){animation-delay:.42s}
body.fx main.enter :is(.card,.bw-r,.it):nth-child(8){animation-delay:.49s}body.fx main.enter :is(.card,.bw-r,.it):nth-child(9){animation-delay:.56s}
body.fx main.enter :is(.card,.bw-r,.it):nth-child(n+10){animation-delay:.63s}
@keyframes rise{from{opacity:0;transform:translateY(1.6vw)}to{opacity:1;transform:none}}
body.fx .card{position:relative}
body.fx .card.lv::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 .12vw var(--sport),0 0 1.8vw color-mix(in srgb,var(--sport) 60%,transparent);opacity:0;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
body.fx .trow .srv.on{animation:pulse 1.1s infinite}
body.fx .bump{animation:bump .8s cubic-bezier(.2,.9,.3,1.2);transform-origin:right center}
@keyframes bump{0%{transform:scale(1.55);color:var(--gold);text-shadow:0 0 1.6vw var(--gold)}60%{color:var(--gold)}100%{transform:none}}
body.fx .aw-title{animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{50%{text-shadow:0 0 1.6vw #D2AC70aa}}
body.fx .confetti{display:block;position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
body.fx .confetti i{position:absolute;top:-3vw;height:1.1vw;border-radius:.12vw;opacity:.85;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
body.fx .aw-wrap{position:relative;z-index:1}
#offline{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:50;background:#B7791F;color:#fff;font:600 1.5vw/1.3 Inter,system-ui,sans-serif;padding:.7vw 1.6vw;border-radius:99px;box-shadow:0 4px 24px #0008;white-space:nowrap}
#offline b{font-weight:800}
</style>
</head>
<body>
<div id="offline" hidden></div>
<div id="goal" hidden></div>
<div id="fin" hidden></div>
<div class="wrap">
  <div class="bar">
    <img class="lg" src="../img/dragon.jpg" alt="">
    <div><div class="ev cond" id="evName">HQ Games 2026</div><div class="venue" id="evVenue"></div></div>
    <div class="sp"></div>
    <div class="dots" id="dots"></div>
    <div class="sportchip cond" id="sportChip">—</div>
    <div class="now cond" id="now">--:--</div>
    <img class="org" src="../img/sabah-electricity.png" alt="Sabah Electricity">
    <i class="rot" id="rot"></i>
  </div>
  <main id="main"></main>
  <div class="ann" id="ann" hidden></div>
  <div class="tick"><div class="lbl cond">RESULTS</div><div class="mq"><span id="ticker"></span></div><div class="ja"><span class="jamark"></span>JUJI-ATELIER</div></div>
</div>
<script type="module" src="display.js?v=20261112f"></script>
</body>
</html>
