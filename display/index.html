<!doctype html>
<html data-keep-awake lang="en" data-theme-lock="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<title>Big Screen · JA Scoring</title>
<link rel="stylesheet" href="../css/theme.css?v=20261114h">
<script src="../js/theme.js?v=20261114h"></script>
<style>
:root{--u:min(1vw,1.7778vh);--sport:#B3162D;--bg:#16181D;--card:#23262E;--line:#343844;--text:#F2F3F5;--muted:#9A9FAA;--gold:#D2AC70}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body.transparent,html:has(body.transparent){background:transparent}
.wrap{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto auto}
.cond{font-family:Rajdhani,Inter,sans-serif}

/* top bar */
.bar{display:flex;align-items:center;gap:calc(1.4*var(--u));padding:calc(.9*var(--u)) calc(2*var(--u));background:linear-gradient(110deg,#8E1325,#4C0B16 60%,#1C1E24);border-bottom:calc(.25*var(--u)) solid var(--sport);color:#fff}
.bar .lg{width:calc(4.2*var(--u));height:calc(4.2*var(--u));border-radius:50%;object-fit:cover;box-shadow:0 0 0 calc(.2*var(--u)) #ffffff33}
.bar .org{height:calc(2.2*var(--u));width:auto}
.bar .ev{font-size:calc(2*var(--u));font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.bar .venue{font-size:calc(1*var(--u));color:#ffffffb3}
.bar .sp{flex:1}
.bar .now{font-size:calc(1.9*var(--u));font-weight:800;font-variant-numeric:tabular-nums}
.bar .nowbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.bar .today{font-size:calc(1.05*var(--u));font-weight:600;opacity:.8;white-space:nowrap;margin-top:calc(.2*var(--u))}
.fsbtn{position:fixed;left:50%;top:calc(1*var(--u));transform:translateX(-50%);z-index:50;font:700 calc(.8*var(--u))/1 inherit;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:calc(.45*var(--u)) calc(1*var(--u));cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
.fsbtn.on{opacity:1;pointer-events:auto}
body.idle{cursor:none}
.sportchip{font-size:calc(1.7*var(--u));font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:calc(.35*var(--u)) calc(1.2*var(--u));border-radius:calc(.5*var(--u));background:var(--sport);color:#fff}
.dots{display:flex;gap:calc(.4*var(--u))}
.dots i{width:calc(.7*var(--u));height:calc(.7*var(--u));border-radius:50%;background:#ffffff33}
.dots i.on{background:#fff}

/* main */
main{padding:calc(1.4*var(--u)) calc(2*var(--u));display:grid;grid-template-columns:1fr calc(26*var(--u));gap:calc(1.4*var(--u));min-height:0}
main.solo{grid-template-columns:1fr}
/* right-hand column: the lists on top, the QR card pinned to the bottom; the lists only get the
   space above it and are cut at the last item that fits, never drawn under the card */
.rcol{display:flex;flex-direction:column;min-height:0}
.rcol .rl{flex:1;min-height:0;overflow:hidden}
.qrc{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:calc(1.3*var(--u));margin-top:calc(1*var(--u));
  padding:calc(.9*var(--u)) calc(1.1*var(--u));border-radius:calc(1.1*var(--u));
  background:linear-gradient(125deg,color-mix(in srgb,var(--sport) 55%,var(--card)) 0%,color-mix(in srgb,var(--sport) 18%,var(--card)) 45%,var(--card) 100%);
  border:1px solid color-mix(in srgb,var(--sport) 60%,var(--line));box-shadow:0 calc(.5*var(--u)) calc(1.6*var(--u)) #0006}
/* the code sits in a white tile inside a viewfinder: four corner marks in the sport colour */
.qrc .qrf{position:relative;flex:none;padding:calc(.55*var(--u))}
.qrc .qri{width:calc(8.4*var(--u));height:calc(8.4*var(--u));padding:calc(.45*var(--u));background:#fff;border-radius:calc(.5*var(--u))}
.qrc .qri canvas,.qrc .qri img{width:100%!important;height:100%!important;image-rendering:pixelated}
.qrc .qrf i{position:absolute;width:calc(1.4*var(--u));height:calc(1.4*var(--u));border:calc(.28*var(--u)) solid #fff}
.qrc .qrf .c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:calc(.5*var(--u)) 0 0 0}
.qrc .qrf .c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 calc(.5*var(--u)) 0 0}
.qrc .qrf .c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 calc(.5*var(--u))}
.qrc .qrf .c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 calc(.5*var(--u)) 0}
.qrc .qrt{min-width:0;position:relative;z-index:1}
.qrc .qrf{z-index:1}
/* the JA mark, large and faint behind the text - the same watermark as the live page header */
.qrc::before{content:"";position:absolute;right:-4%;top:50%;height:118%;aspect-ratio:140/79;transform:translateY(-50%) rotate(-6deg);
  background:#fff;opacity:.08;pointer-events:none;-webkit-mask:url(../img/ja.svg) center/contain no-repeat;mask:url(../img/ja.svg) center/contain no-repeat}
.qrc .qk{display:flex;align-items:center;gap:calc(.45*var(--u));font-size:calc(1*var(--u));font-weight:800;letter-spacing:.16em;color:#fff;opacity:.9}
.qrc .qk .dot{width:calc(.7*var(--u));height:calc(.7*var(--u));border-radius:50%;background:#FF4D63;box-shadow:0 0 0 0 #FF4D63aa}
.qrc .qrt b{display:block;margin-top:calc(.25*var(--u));font-size:calc(1.85*var(--u));line-height:1.1;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden}
.qrc .qrt span{display:block;margin-top:calc(.45*var(--u));font-size:calc(1*var(--u));color:#ffffffb8;font-weight:600}
/* lively mode: a soft shine sweeps the card, the corner marks breathe, the live dot pings - none of it over the code itself */
body.fx .qrc::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff22,transparent);transform:translateX(-120%);animation:qrshine 6s ease-in-out infinite}
body.fx .qrc .qrf i{animation:qrbreathe 2.4s ease-in-out infinite}
body.fx .qrc .qk .dot{animation:qrping 1.6s ease-out infinite}
@keyframes qrshine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes qrbreathe{0%,100%{opacity:1;scale:1}50%{opacity:.55;scale:.86}}
@keyframes qrping{0%{box-shadow:0 0 0 0 #FF4D63aa}100%{box-shadow:0 0 0 calc(.9*var(--u)) #FF4D6300}}
.col h2{margin:0 0 calc(.8*var(--u));font-size:calc(1.3*var(--u));letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:calc(.6*var(--u))}
.col h2 .live{background:#E0364F;color:#fff;border-radius:calc(.3*var(--u));padding:calc(.1*var(--u)) calc(.6*var(--u));font-size:calc(1*var(--u));letter-spacing:.1em;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.grid{display:grid;gap:calc(1*var(--u));grid-template-columns:repeat(var(--cols,2),1fr);align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-left:calc(.4*var(--u)) solid var(--sport);border-radius:calc(1*var(--u));padding:calc(1*var(--u)) calc(1.3*var(--u));min-width:0;box-shadow:0 calc(.4*var(--u)) calc(1.2*var(--u)) #0000004d}
.card .meta{display:flex;gap:calc(1*var(--u));font-size:calc(1*var(--u));color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card .meta .st{margin-left:auto;color:var(--gold);font-weight:800}
.trow{display:grid;grid-template-columns:calc(1.2*var(--u)) 1fr auto auto;align-items:center;gap:calc(.8*var(--u));margin-top:calc(.5*var(--u))}
.trow .srv{width:calc(.8*var(--u));height:calc(.8*var(--u));border-radius:50%;background:transparent}
.trow .srv.on{background:var(--gold);box-shadow:0 0 calc(.8*var(--u)) var(--gold)}
.trow .nm{font-size:var(--nm,calc(2.2*var(--u)));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sm{font-size:calc(var(--nm,calc(2.2*var(--u)))*.7);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-width:calc(2*var(--u));text-align:center}
.trow .bg{font-size:var(--big,calc(3.6*var(--u)));font-weight:900;font-variant-numeric:tabular-nums;min-width:calc(4.6*var(--u));text-align:right;line-height:1}
.trow .nm .pl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow-wrap:anywhere;font-size:.5em;font-weight:600;color:var(--muted);overflow:hidden;line-height:1.2}
.trow.win .nm{color:var(--gold)}
.trow.win .bg{color:#FF4D63}
.tag{display:inline-block;background:var(--gold);color:#000;font-size:calc(.8*var(--u));font-weight:900;border-radius:calc(.3*var(--u));padding:calc(.05*var(--u)) calc(.5*var(--u));margin-left:calc(.6*var(--u));vertical-align:middle}
.hist{margin-top:calc(.5*var(--u));font-size:calc(1*var(--u));color:var(--muted);font-variant-numeric:tabular-nums}
.clk{font-variant-numeric:tabular-nums}

/* bowling team table */
.bw{display:grid;gap:calc(.5*var(--u));grid-auto-flow:column;grid-template-rows:repeat(var(--rows,11),auto);align-content:start}
.bw.two{grid-template-columns:1fr 1fr;column-gap:calc(1.2*var(--u))}
.bw-r{display:grid;grid-template-columns:calc(2.6*var(--u)) 1fr auto calc(6*var(--u));align-items:center;gap:calc(1*var(--u));background:var(--card);border:1px solid var(--line);border-left:calc(.4*var(--u)) solid var(--sport);border-radius:calc(.7*var(--u));padding:calc(.42*var(--u)) calc(1.2*var(--u));min-width:0}
.bw-p{font-size:calc(1.7*var(--u));font-weight:900;color:var(--muted);text-align:center}
.bw-r:nth-child(1) .bw-p{color:var(--gold)}
.bw-n{font-size:calc(1.8*var(--u));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bw-g{font-size:calc(.95*var(--u));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.bw-r.fin .bw-g{color:var(--gold)}
.bw-t{font-size:calc(2.1*var(--u));font-weight:900;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
/* side lists */
.list .it{display:grid;grid-template-columns:auto 1fr auto;gap:calc(.8*var(--u));align-items:center;padding:calc(.6*var(--u)) calc(.8*var(--u));border-bottom:1px solid var(--line);font-size:calc(1.15*var(--u))}
.list .it .n{color:var(--muted);font-weight:700;font-size:calc(.95*var(--u));white-space:nowrap}
.list .it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.list .it .t b{color:var(--gold)}
.list .it .s{font-weight:900;font-variant-numeric:tabular-nums}
.list + h2{margin-top:calc(1.4*var(--u))}
.empty{color:var(--muted);font-size:calc(1.3*var(--u));padding:calc(1*var(--u)) 0}
.card[style*="--cc"]{border-left-color:var(--cc)}
.card .meta{flex-wrap:wrap;row-gap:calc(.35*var(--u));align-items:center}
.card .meta>span{white-space:nowrap}
.card .meta .ctb{background:var(--text,#ECEDEF);color:var(--bg,#16181d);border-radius:calc(.4*var(--u));padding:0 calc(.6*var(--u));font-weight:900;letter-spacing:.06em}
.card .meta .evc{color:var(--cc,var(--muted));font-weight:800}
.card .meta .ptb{background:linear-gradient(120deg,#D2AC70,#9a7442);color:#16181d;border-radius:calc(.4*var(--u));padding:0 calc(.6*var(--u));font-weight:900;letter-spacing:.12em}
.grid.courts{grid-auto-rows:1fr}
.card.idle{display:flex;flex-direction:column;opacity:.85;border-left-color:var(--line)}
.card.idle .idlebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(.4*var(--u));text-align:center;color:var(--muted);font-size:calc(1.2*var(--u));font-weight:700;padding:calc(1*var(--u)) 0}
.card.idle .idlebox b{color:var(--text,#ECEDEF);font-size:calc(var(--nm,calc(2.2*var(--u)))*.9)}
.card.idle .idlebox i{font-style:normal;color:var(--cc,var(--muted));font-size:calc(1*var(--u));letter-spacing:.08em}

/* featured */
.feat{display:flex;flex-direction:column;justify-content:center;height:100%;gap:calc(1.5*var(--u))}
.feat .meta{font-size:calc(1.6*var(--u));color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;text-align:center}
.feat .st{font-size:calc(2.2*var(--u));color:var(--gold);font-weight:900;text-align:center;text-transform:uppercase}
.feat .trow{grid-template-columns:calc(2*var(--u)) 1fr auto auto;--nm:calc(5*var(--u));--big:calc(11*var(--u));background:var(--card);border-radius:calc(1*var(--u));padding:calc(1*var(--u)) calc(2*var(--u));border-left:calc(.6*var(--u)) solid var(--sport)}
.feat .trow .srv{width:calc(1.4*var(--u));height:calc(1.4*var(--u))}
.feat .trow .sm{min-width:calc(6*var(--u))}
.feat .hist{text-align:center;font-size:calc(1.8*var(--u))}
.feat .tag{font-size:calc(1.4*var(--u))}

/* scorer announcements */
.ann{display:flex;align-items:stretch;background:#F2B544;color:#1C1E24;min-height:calc(4.4*var(--u));overflow:hidden}
.ann[hidden]{display:none}
.ann .al{display:flex;align-items:center;gap:calc(.7*var(--u));padding:0 calc(1.6*var(--u));background:var(--ac,#B3162D);color:#fff;font-weight:900;font-size:calc(1.5*var(--u));letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ann .at{flex:1;display:flex;align-items:center;padding:calc(.5*var(--u)) calc(1.8*var(--u));font-weight:800;font-size:calc(2.1*var(--u));line-height:1.15;animation:annin .45s both}
.ann .an{display:flex;align-items:center;padding:0 calc(1.4*var(--u));font-weight:800;font-size:calc(1.1*var(--u));opacity:.6;white-space:nowrap}
@keyframes annin{from{opacity:0;transform:translateY(calc(.8*var(--u)))}to{opacity:1;transform:none}}
/* ticker */
.tick{display:flex;align-items:center;background:#111317;border-top:1px solid var(--line);height:calc(3.4*var(--u));overflow:hidden}
.tick .ja{display:flex;align-items:center;gap:calc(.6*var(--u));padding:0 calc(1.4*var(--u));color:#ffffff80;font-size:calc(.8*var(--u));letter-spacing:calc(.2*var(--u));font-weight:600;white-space:nowrap}
.tick .ja .jamark{width:calc(2*var(--u));height:calc(1.2*var(--u))}
.tick .lbl{background:#B3162D;color:#fff;font-weight:900;font-size:calc(1.2*var(--u));padding:0 calc(1.2*var(--u));height:100%;display:flex;align-items:center;letter-spacing:.1em;white-space:nowrap}
.tick .mq{flex:1;overflow:hidden;white-space:nowrap}
.tick .mq span{display:inline-block;padding-left:100%;font-size:calc(1.3*var(--u));font-weight:600;animation:mq var(--dur,40s) linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.setup{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(2*var(--u));color:var(--muted)}
/* prize giving */
.aw-wrap{height:100%;display:flex;flex-direction:column;gap:calc(1.4*var(--u))}
.aw-title{margin:0;font-size:calc(2.6*var(--u));letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--gold)}
.aw-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:calc(1.2*var(--u));align-content:start}
.aw-card{min-width:0;background:var(--card);border:1px solid var(--line);border-top:calc(.35*var(--u)) solid var(--c);border-radius:calc(1*var(--u));padding:calc(1*var(--u)) calc(1.3*var(--u));animation:awin .6s both;box-shadow:0 calc(.4*var(--u)) calc(1.2*var(--u)) #0000004d}
.aw-cat{font-size:calc(1.5*var(--u));font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:calc(.6*var(--u))}
.aw-row{display:flex;align-items:center;gap:calc(.9*var(--u));padding:calc(.35*var(--u)) 0}
.aw-m{width:calc(2.2*var(--u));height:calc(2.2*var(--u));border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(1.1*var(--u));color:#fff;flex:none}
.aw-row.p1 .aw-m{background:#D2AC70;box-shadow:0 0 calc(1*var(--u)) #D2AC7066}.aw-row.p2 .aw-m{background:#A7AEB8}.aw-row.p3 .aw-m{background:#B07A4A}
.aw-n{font-weight:800;font-size:calc(1.6*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw-row.p1 .aw-n{font-size:calc(2*var(--u));color:#fff}
.aw-grid.many{gap:calc(1*var(--u));margin-top:calc(1*var(--u))}.aw-grid.many .aw-card{padding:calc(1.4*var(--u)) calc(1.1*var(--u)) calc(1.6*var(--u))}.aw-grid.many .aw-cat{font-size:calc(1.25*var(--u));margin-bottom:calc(1*var(--u))}.aw-grid.many .aw-row{padding:calc(.6*var(--u)) 0;gap:calc(.7*var(--u))}.aw-grid.many .aw-n{font-size:calc(1.3*var(--u));white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.aw-grid.many .aw-row.p1 .aw-n{font-size:calc(1.55*var(--u))}
.aw-empty{display:grid;place-items:center;height:100%;font-size:calc(3*var(--u));color:var(--muted);font-weight:700}
@keyframes awin{from{opacity:0;transform:translateY(calc(1.5*var(--u)))}to{opacity:1;transform:none}}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:calc(3*var(--u));margin-top:calc(1.2*var(--u));font-size:calc(1.5*var(--u));color:var(--muted);text-align:left}
.evs span{display:block;line-height:1.5}.evs i{font-style:normal;opacity:.7}.evs>div:last-child{text-align:right}
.feat.hasev{gap:calc(1*var(--u))}.feat.hasev .trow{--nm:calc(4*var(--u));--big:calc(7.5*var(--u));padding:calc(.4*var(--u)) calc(2*var(--u))}.feat.hasev .evs{margin-top:calc(.2*var(--u));padding:0 calc(2.6*var(--u));font-size:calc(1.45*var(--u))}
#goal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;min-width:calc(52*var(--u));max-width:calc(86*var(--u));text-align:center;background:linear-gradient(160deg,#16181dF2,#0b0c0fF2);border:calc(.25*var(--u)) solid var(--gc,#16a34a);border-radius:calc(2*var(--u));padding:calc(2.2*var(--u)) calc(3.5*var(--u));box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) #000c;animation:goalin .45s cubic-bezier(.2,.9,.3,1.2) both;color:#fff}
#goal .gk{font-size:calc(5.5*var(--u));font-weight:700;letter-spacing:.08em;color:var(--gc,#16a34a);line-height:1}
#goal .gs{font-size:calc(2.6*var(--u));font-weight:700;margin-top:calc(1*var(--u));text-wrap:balance}#goal .gs b{color:#D2AC70;margin:0 calc(.8*var(--u))}
#goal .gn{font-size:calc(2.2*var(--u));margin-top:calc(.8*var(--u));font-weight:700}
#goal .gp{font-size:calc(1.3*var(--u));letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-top:calc(1*var(--u))}
@keyframes goalin{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* ---------- lively bits (only with body.fx; add ?fx=off to the link for a still screen) ---------- */
.rot{display:none}
#fin{position:fixed;right:calc(2*var(--u));top:calc(7.6*var(--u));z-index:35;max-width:calc(36*var(--u));background:linear-gradient(160deg,#1c1f26f7,#0e0f12f7);border-left:calc(.45*var(--u)) solid var(--fc,#B3162D);border-radius:calc(.9*var(--u));padding:calc(.9*var(--u)) calc(1.7*var(--u)) calc(1*var(--u));box-shadow:0 calc(1*var(--u)) calc(3*var(--u)) #000a;color:#fff;animation:finin .5s cubic-bezier(.2,.9,.3,1.1) both}
#fin[hidden]{display:none}
#fin .fk{font-size:calc(1.1*var(--u));letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
#fin .fs{font-size:calc(2*var(--u));font-weight:700;line-height:1.2;margin-top:calc(.2*var(--u))}#fin .fs b{color:var(--gold);margin:0 calc(.5*var(--u))}
#fin .fw{font-size:calc(1.35*var(--u));font-weight:700;margin-top:calc(.2*var(--u))}
