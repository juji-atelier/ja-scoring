<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<meta name="description" content="Live scores, results and standings · Kompleks Sukan Tun Adnan · 14–15 Nov">

<meta property="og:description" content="Live scores, results and standings · Kompleks Sukan Tun Adnan · 14–15 Nov">
<meta property="og:image" content="https://juji-atelier.github.io/ja-scoring/img/og.jpg">

<title>Live Scores</title>

<script src="../js/theme.js?v=20261115d"></script>
<style>
:root{--sport:var(--acc);--text:var(--ink);--muted:var(--mute)}
*{box-sizing:border-box}
html,body{margin:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cond{font-family:Rajdhani,Inter,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
/* header */
.hd{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:12px;height:66px}
.hd .brand b{display:block;font-family:Rajdhani,Inter;font-size:22px;letter-spacing:1.4px;line-height:1;text-transform:uppercase}
.hd .brand small{color:var(--mute);font-size:12px}
.hd .sp{flex:1}
/* hero */
.hero{background:var(--hero);color:#fff;border-radius:22px;margin:18px 0 14px;padding:22px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(#ffffff26,transparent 65%)}
.hero h1{margin:0;font-family:Rajdhani,Inter;font-size:36px;letter-spacing:1px;line-height:1;text-transform:uppercase;position:relative}
.hero p{margin:6px 0 0;opacity:.88;font-size:14px;position:relative}
.note{margin-top:12px;background:#0000002e;border-radius:10px;padding:8px 12px;font-size:14px;position:relative}
/* scorer announcement */
.ann{display:flex;gap:12px;align-items:flex-start;margin:4px 0 14px;padding:13px 15px;border-radius:14px;
  background:color-mix(in srgb,#F2B544 18%,var(--card));border:1px solid color-mix(in srgb,#F2B544 55%,var(--line));border-left:5px solid var(--sport)}
.ann .ai{font-size:22px;line-height:1}
.ann b{display:block;font-size:16px;line-height:1.3;word-break:break-word}
.ann small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
/* sport chips */
nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
@media(min-width:700px){nav{flex-wrap:wrap;overflow:visible}}
nav a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;line-height:1.1}
nav a:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc));flex:none}
nav a small{display:none}
nav a.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
nav a.on:before{background:#fff}
main{padding-bottom:10px}
.sub{display:flex;gap:4px;margin:12px 0 4px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:14px}
.sub button{flex:1;font:inherit;font-weight:600;font-size:13px;color:var(--mute);background:none;border:0;border-radius:10px;padding:9px 6px;cursor:pointer}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:22px 2px 10px;display:flex;align-items:center;gap:10px;font-weight:700}
h2 .lv{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-size:11px;letter-spacing:1px}
h2 .lv:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:japulse 1.6s infinite}
.m{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin:10px 0;box-shadow:var(--shadow)}
.m .meta{display:flex;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap;align-items:center;margin-bottom:6px}
.m .meta:before{content:"";width:8px;height:8px;border-radius:3px;background:var(--sport)}
.m .meta .st{margin-left:auto;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.m.live .meta .st{color:var(--live)}
.r{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:4px 0}
.r .dot{width:7px;height:7px;border-radius:50%}
.r .dot.on{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.r .n{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .n .pl{display:block;font-size:12.5px;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:13px;color:var(--mute);font-weight:600;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.r .b{font-family:Inter,sans-serif;font-size:26px;font-weight:800;min-width:42px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.05}
.r.win .n:after{content:" ✓";color:var(--gold);font-size:13px}
.r.win .b{color:var(--acc)}
.tag{background:var(--acc-soft);color:var(--acc);font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.h{font-size:12px;color:var(--mute);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
/* finished matches: one compact strip each, two across on a wide screen */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:10px;margin:10px 0}
.rc{position:relative;isolation:isolate;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cc,var(--sport));
  border-radius:14px;padding:9px 14px 8px;box-shadow:var(--shadow);overflow:hidden}
.rc:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--cc,var(--sport)) 14%,transparent),transparent 55%)}
.rc.wb:before{background:linear-gradient(270deg,color-mix(in srgb,var(--cc,var(--sport)) 14%,transparent),transparent 55%)}
.rc .rh{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mute);margin-bottom:5px;white-space:nowrap;overflow:hidden}
.rc .rh .evc{color:var(--cc,var(--mute));font-weight:800}
.rc .rh .ctb{background:var(--ink);color:var(--bg);border-radius:5px;padding:0 6px;font-weight:900;font-size:10.5px}
.rc .rh .st{margin-left:auto;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.rc .rb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.rc .rt{min-width:0}
.rc .rt.b{text-align:right}
.rc .rt b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .rt.w b{font-weight:900}
.rc .rt.l b{color:var(--mute);font-weight:600}
.rc .rt small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rc .rt.me b{color:var(--acc)}
.rc .rs{display:flex;align-items:center;gap:6px;font-family:Inter,sans-serif;font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.rc .rs span{color:var(--mute)}
.rc .rs span.w{color:var(--acc)}
.rc .rs i{font-style:normal;font-size:15px;color:var(--mute)}
.rc .hh{font-size:11px;color:var(--mute);margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mute);padding:12px 2px;font-size:14px}
.donebar{margin:4px 0 10px;padding:10px 14px;border-radius:12px;font-size:14px;background:color-mix(in srgb,#16a34a 16%,var(--card));border:1px solid color-mix(in srgb,#16a34a 45%,var(--line))}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;background:var(--bg2)}
td.t,th.t{text-align:left;padding-left:14px}
tr:nth-child(2) td.t{font-weight:700}
tr:nth-child(2) td.t:before{content:"1";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;margin-right:8px}
/* find / follow / champion */
.findrow{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.findrow input{flex:1;font:inherit;font-size:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.findrow span{color:var(--mute);font-size:12px;white-space:nowrap}
#findHits:not(:empty){display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#findHits button,.fbar button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#findHits button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));font-size:14px}
.fbar b{flex:1;min-width:120px}
.fbar button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.r .n.me{color:var(--gold);font-weight:800}
.r .n.me:before{content:"★ "}
mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
tr.me td{background:color-mix(in srgb,var(--gold) 14%,var(--card))}
/* champions: a podium per category, side by side, confetti falling behind it */
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px;margin:14px 0 6px}
.champ{position:relative;overflow:hidden;isolation:isolate;border-radius:18px;padding:14px 14px 0;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--cc,var(--sport)) 22%,var(--card)),var(--card) 70%);
  border:1px solid var(--line);border-top:4px solid var(--cc,var(--sport));box-shadow:var(--shadow);animation:chIn .6s var(--d,0s) both}
.champ .k{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;gap:2px;
  font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.champ .k b{font-size:12px;letter-spacing:.08em;color:var(--cc,var(--ink))}
.podium{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;margin-top:10px}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pl .nm{font-family:Rajdhani,Inter;font-weight:700;text-transform:uppercase;line-height:1.05;font-size:14px;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pl.p1 .nm{font-size:18px}
.pl .cup{font-size:30px;line-height:1;margin-bottom:4px;filter:drop-shadow(0 4px 8px #0006);animation:chCup 2.6s ease-in-out infinite}
.pl .blk{width:100%;display:grid;place-items:center;border-radius:10px 10px 0 0;box-shadow:inset 0 2px 0 #fff6}
.pl .blk i{font-style:normal;font-family:Inter,sans-serif;font-weight:900;font-size:22px;color:#0009}
.pl.p1 .blk{height:74px;background:linear-gradient(180deg,#FFE08A,#D2A13A)}
.pl.p2 .blk{height:52px;background:linear-gradient(180deg,#F4F6FA,#A9B3BF)}
.pl.p3 .blk{height:36px;background:linear-gradient(180deg,#F3BD8A,#B06A32)}
.cf{position:absolute;inset:0;z-index:0;pointer-events:none}
.cf i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;opacity:.9;animation:cfFall 4s linear infinite}
.cf i:nth-child(3n){width:6px;height:6px;border-radius:50%}
@keyframes cfFall{0%{transform:translateY(0) rotate(var(--r,0deg))}100%{transform:translateY(260px) rotate(calc(var(--r,0deg) + 540deg));opacity:0}}
@keyframes chIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes chCup{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.champ,.pl .cup,.cf i{animation:none}.cf{display:none}}
.upd{font-size:12px;color:var(--mute);text-align:right;margin-top:6px}
@media(max-width:600px){.wrap{padding:0 14px}.hd .wrap{height:60px;gap:8px}.hd .brand b{font-size:18px}.hd .brand small{display:none}.logo-org{height:16px}.logo-dragon{width:36px;height:36px}.hero{padding:20px}.hero h1{font-size:30px}}
/* JA splash: logo in the middle, then fades into the page (on open and on refresh) */
.jasplash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 42%,#2a2d35,#0e0f12 70%);animation:jasplashOut .6s ease 1.7s forwards}
.jasplash i{display:block;width:min(52vw,230px);aspect-ratio:140/79;background:linear-gradient(160deg,#fff,#c9ced6 45%,#8a9099);-webkit-mask:url(../img/ja.svg) center/contain no-repeat;mask:url(../img/ja.svg) center/contain no-repeat;opacity:0;animation:jasplashIn .7s cubic-bezier(.2,.7,.2,1) .1s forwards}
.jasplash u{display:block;height:2px;width:0;background:linear-gradient(90deg,transparent,#D2AC70,transparent);animation:jasplashLine .7s ease .5s forwards}
.jasplash b{font:600 12px/1 Inter,system-ui,sans-serif;letter-spacing:6px;padding-left:6px;color:#b8bec7;opacity:0;animation:jasplashIn .6s ease .7s forwards}
.nosplash .jasplash{display:none}
@keyframes jasplashIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes jasplashLine{to{width:min(40vw,170px)}}
@keyframes jasplashOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.jasplash,.jasplash *{animation-duration:.01s!important;animation-delay:0s!important}.jasplash{animation-delay:1.2s!important}}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute)}
.evs span{display:block;line-height:1.5}.evs i{font-style:normal;opacity:.75}.evs>div:last-child{text-align:right}

/* ---------- sport grid (js/sportnav.js) inside the old nav ---------- */
nav.sgrid{overflow:visible;flex-wrap:nowrap;padding:0}
nav.sgrid a:before{content:none}
nav.sgrid a small{display:block}
/* ---------- livelier match cards ---------- */
.m{position:relative}
.m.hascat{border-left:5px solid var(--cc)}
html[data-theme="dark"] .m.hascat{--cc:var(--ccd)}
.m .meta:before{display:none}
.m .meta .ctb{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 7px;font-weight:900;font-size:11px}
.m .meta .evc{color:var(--cc,var(--mute));font-weight:800;letter-spacing:.02em}
.m .meta .ptb{background:linear-gradient(120deg,#D2AC70,#9a7442);color:#fff;border-radius:6px;padding:1px 7px;font-weight:900;font-size:10.5px;letter-spacing:.08em}
.r.lead .b{color:var(--acc)}
.m.flash{box-shadow:0 0 0 2px #D2AC70,0 0 26px #D2AC7088;transition:box-shadow .3s}
.r .b{position:relative}
.plus1{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);font:900 13px/1 Inter,sans-serif;font-style:normal;color:#9a7442;background:#fff6e5;border:1px solid #D2AC70;border-radius:7px;padding:3px 6px;animation:plusup 2.8s ease-out forwards}
@keyframes plusup{0%{opacity:0;transform:translateY(-20%)}12%{opacity:1;transform:translateY(-50%)}75%{opacity:1}100%{opacity:0;transform:translateY(-110%)}}
/* ---------- just finished ---------- */
.fin{margin:10px 0;border-radius:16px;overflow:hidden;border:1px solid #D2AC7088;background:var(--card);box-shadow:var(--shadow);animation:finin .5s ease-out}
.fin .bn{background:linear-gradient(120deg,#D2AC70,#9a7442);color:#fff;padding:9px 14px;font-weight:900;font-size:15px}
.fin .bd{padding:10px 14px;font-size:13.5px;color:var(--mute);line-height:1.45}.fin .bd b{color:var(--ink)}
@keyframes finin{from{opacity:0;transform:translateY(6px)}}
/* ---------- live status line ---------- */
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;margin-right:6px;vertical-align:1px;animation:japulse 1.6s infinite}
/* ---------- moving background glow in the sport's colour ---------- */
/* Two soft blobs on their own fixed layers, moved with transform only (GPU, no repaint). */
html{background:var(--bg)}body{background:transparent}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;will-change:transform}
body::before{inset:-25% -25% auto -25%;height:90vh;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--sport) 26%, transparent), transparent);
  animation:jaDriftA 26s ease-in-out infinite alternate}
body::after{width:70vmax;height:70vmax;right:-30vmax;top:30vh;border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb, #B3202F 12%, transparent), transparent);
  animation:jaDriftB 34s ease-in-out infinite alternate}
html[data-theme="dark"] body::before{background:radial-gradient(closest-side, color-mix(in srgb, var(--sport) 38%, transparent), transparent)}
html[data-theme="dark"] body::after{background:radial-gradient(closest-side, color-mix(in srgb, #B3202F 20%, transparent), transparent)}
@keyframes jaDriftA{0%{transform:translate3d(-12%,-6%,0) scale(1)}50%{transform:translate3d(8%,2%,0) scale(1.12)}100%{transform:translate3d(14%,-4%,0) scale(.95)}}
@keyframes jaDriftB{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-45vw,22vh,0) scale(1.25)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
@media (prefers-reduced-motion:reduce){.plus1,.fin,.ldot{animation:none}}
/* iPhone zooms into text boxes under 16px */
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:max(16px,1em)!important}}
/* ---------- big faded JA watermark on the right of the title card ---------- */
.hero:before{content:"";position:absolute;right:-2.5%;top:50%;height:104%;width:auto;aspect-ratio:140/79;transform:translateY(-50%) rotate(-6deg);background:#fff;opacity:.09;pointer-events:none;-webkit-mask:url(../img/ja.svg) center/contain no-repeat;mask:url(../img/ja.svg) center/contain no-repeat}
@media(max-width:600px){.hero:before{width:200px;height:114px;right:-40px;opacity:.08}}
/* ---------- up next, compact ---------- */
.nxg{margin:0 0 6px}
.nxh{font-weight:800;font-size:14px;margin:14px 0 6px;color:var(--ink)}
/* one box per court, sharing the row: two courts = two halves, six tables = three per row */
.nxl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.nx{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cc,var(--line));
  border-radius:12px;padding:10px 14px;min-width:0}
.nx .nh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nx .ctb{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-weight:900;font-size:11px;white-space:nowrap}
.nx .nr{font-size:11px;color:var(--mute);text-align:right}
.nx .nt{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;font-weight:800;font-size:15px;line-height:1.3}
.nx .nt span{overflow-wrap:anywhere}
.nx .nt i{font-style:normal;font-size:11px;color:var(--mute);font-weight:600;line-height:1.2}
.nx.me{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
@media (max-width:600px){
  .nxl{grid-template-columns:1fr 1fr;gap:6px}
  .nx{padding:8px 10px;gap:4px}
  .nx .nh{flex-wrap:wrap;gap:4px}
  .nx .nt{font-size:13.5px;flex-direction:column;align-items:flex-start}
  .nx .nr{font-size:10.5px}
}
/* ---------- knockout bracket ---------- */
.bk{margin:6px 0 22px}
.bk h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:800}
.bk .bscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.bk .brow{display:flex;min-width:max-content}
.bk .bcol{display:flex;flex-direction:column;width:178px}
.bk .bt{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 6px 2px}
.bk .bcol:not(:first-child) .bt{margin-left:18px}
.bk .bbody{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.bk .pair{position:relative;display:flex;flex-direction:column;justify-content:space-around;gap:14px;padding-right:18px;flex:1}
/* the bracket line joining two matches to the one they feed */
.bk .pair.two::after{content:"";position:absolute;right:0;top:25%;bottom:25%;width:18px;border:2px solid var(--line);border-left:0;border-radius:0 8px 8px 0}
.bk .bcol:last-child .pair{padding-right:0;flex:0;margin:auto 0}
.bk .bcol:not(:first-child) .bm{margin-left:18px}
.bk .bcol:not(:first-child) .bm::before{content:"";position:absolute;left:-18px;top:50%;width:18px;border-top:2px solid var(--line)}
.bk .bm{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px 6px;box-shadow:var(--shadow)}
.bk .bm.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.bk .bh{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;font-weight:700;color:var(--mute);margin-bottom:3px;white-space:nowrap}
.bk .bm.live .bh span:last-child{color:var(--live)}
.bk .ld{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:4px;vertical-align:1px}
.bk .br{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px;font-weight:800}
.bk .br + .br{border-top:1px solid var(--line)}
.bk .br .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .br b{font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
.bk .br.ph .bn{font-style:italic;font-weight:600;color:var(--mute)}
.bk .br.win{color:var(--gold)}
.bk .br.lose{color:var(--mute);font-weight:600}
.bk .bchamp{margin:12px 0 0 18px;padding:8px 10px;border-radius:12px;text-align:center;font-weight:900;font-size:13px;
  background:linear-gradient(120deg,#D2AC70,#9a7442);color:#16181d}
.bk .bchamp span{display:block;font-size:15px}
.bk .b3{margin-top:12px;max-width:178px}
.bk .br.me .bn{color:var(--acc)}
.bk .bm:has(.br.me){border-color:var(--acc)}


/* ---------- laptop / desktop: sticky left column, wide match area ---------- */
@media (min-width:1100px){
  .wrap{max-width:1360px;padding:0 28px}
  .page{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;align-items:start}
  .side{position:sticky;top:66px;max-height:calc(100vh - 66px);overflow:auto;scrollbar-width:none;padding-bottom:12px}
  .side::-webkit-scrollbar{display:none}
  .side .hero{margin:18px 0 12px;padding:20px 22px}
  .side .hero h1{font-size:30px}
  .side .sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .page main{padding-top:6px}
  .page .sub{margin-top:18px}
  .nxg{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;margin:0 0 8px}
  .nxh{margin:0;padding-top:12px;font-size:15px;text-align:right;color:var(--mute)}
  .nxl{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .nx{padding:11px 16px}
  .nx .nt{font-size:16px}
  #body table{width:100%}
}
@media (min-width:1500px){ .wrap{max-width:1500px} .page{grid-template-columns:360px minmax(0,1fr)} }
