<style>
:root{--silver:#A7AEB8;--bronze:#B07A4A;--f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- brand header ---------- */
.bh{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bh .in{max-width:860px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px;height:66px}
.bh .brand b{display:block;font-family:Rajdhani,Inter;font-size:22px;letter-spacing:1.4px;line-height:1;text-transform:uppercase;white-space:nowrap}
.bh .brand small{color:var(--mute);font-size:12px}
.bh .sp{flex:1}
/* 2026-11-08: same sport chips as the Live Scores page, so Bowling feels like one of the tabs (not a separate site) */
.sportnav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 0 10px;scrollbar-width:none}
.sportnav.sgrid{overflow:visible;padding:0;margin:0 0 12px}
.sportnav.sgrid a:before{content:none}
.sportnav::-webkit-scrollbar{display:none}
@media(min-width:700px){.sportnav{flex-wrap:wrap;overflow:visible}}
.sportnav a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;line-height:1.1}
.sportnav a:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc));flex:none}
.sportnav a.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sportnav a.on:before{background:#fff}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 10px}
.hero{background:var(--hero);color:#fff;border-radius:22px;margin:18px 0 14px;padding:22px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(#ffffff26,transparent 65%);pointer-events:none}
.hero h1{margin:0;font-family:Rajdhani,Inter;font-size:30px;letter-spacing:.6px;line-height:1.05;text-transform:uppercase;position:relative}
.hero .sub{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px;opacity:.9;flex-wrap:wrap;position:relative}
.hero .sub a{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#ffffff80;display:inline-block}
.dot.on{background:#3DD68C;box-shadow:0 0 0 3px #3dd68c40}
.dot.off{background:#FF6B7A}
.pill{background:#ffffff26;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.5px}

/* tabs (phone) */
.tabs{display:flex;gap:4px;margin:4px 0 12px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;background:none;border:0;color:var(--mute);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}

/* ---------- board rows ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;box-shadow:var(--shadow)}
.row .rk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--bg2);color:var(--mute);font-size:13px}
.row.r1 .rk{background:var(--gold);color:#fff}.row.r2 .rk{background:var(--silver);color:#fff}.row.r3 .rk{background:var(--bronze);color:#fff}
.row .nm{font-weight:700;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--mute);font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.row .tot{text-align:right}
.row .tot b{display:block;font-size:21px;font-weight:800}
.row.r1 .tot b{color:var(--acc)}
.row .tot small{color:var(--mute);font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.games{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.games span{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:1px 6px;font-size:12px;min-width:34px;text-align:center}
.games span.e{color:color-mix(in srgb,var(--mute) 55%,transparent)}
.row.click{cursor:pointer}
.row.click:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.members{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mem{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;align-items:start}
.tg{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tg.L{background:#2F5FA622;color:#3E77C9}.tg.P{background:var(--acc-soft);color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:30px 10px;font-size:14px}
.note{color:var(--mute);font-size:12px;margin-top:14px;line-height:1.5}

body.pc .tabs{display:none}

.cols{display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;gap:18px;align-items:start}
.col{min-width:0}
.col h2{margin:2px 2px 10px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);font-weight:700}
.col .list{max-height:calc(100vh - 300px);overflow-y:auto;padding:2px 4px 4px 2px}
@media (max-width:1400px){.cols{grid-template-columns:1fr 1fr}}

.fsbtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;padding:0}
.fsbtn:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
@media (max-width:600px){.fsbtn{display:none}}
/* ---------- board extras: event card, leaders, podium, search, pre-start list ---------- */
.evcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.evb{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;font-weight:600;color:var(--ink)}
.cd{font-size:15px;margin-bottom:6px;color:var(--acc)}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.lcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);color:var(--ink);display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:end;min-width:0}
.lcard small{grid-column:1/-1;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.lcard b{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard span{grid-column:1;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard em{grid-column:2;grid-row:2/span 2;font-style:normal;font-weight:900;font-size:22px;color:var(--acc)}
.hero.final{background:linear-gradient(120deg,#6f5220,#a8823f 55%,#6f5220)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:0 0 14px}
.pcard{background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.pcard h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.prow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}.prow .md{font-size:22px}.prow .pn small{display:block;color:var(--mute);font-size:11px}
.prow.p1 .pn b,.prow.p1>b{font-size:17px}.prow>b{font-weight:900}
.findbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.findbar input{flex:1;padding:10px 14px;border-radius:12px}
.findbar span{color:var(--mute);font-size:12px;white-space:nowrap}
mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.row.found{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.mem.me{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:8px;padding:4px 6px;margin:-4px -6px}
.prelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pteam{--tc:var(--acc);position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));border-radius:18px;padding:16px 16px 10px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 9%,var(--card)),var(--card) 70%)}
.pteam:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tc)}
.pteam .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.pteam .ph b{display:block;font-family:Rajdhani,Inter;font-size:21px;font-weight:700;letter-spacing:.4px;line-height:1.05;text-transform:uppercase;color:var(--ink)}
.pteam .ph small{display:block;color:color-mix(in srgb,var(--tc) 70%,var(--mute));font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.lnb{flex:none;display:flex;flex-direction:column;align-items:center;background:var(--tc);color:#fff;border-radius:11px;padding:4px 9px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.lnb b{font-family:Rajdhani,Inter;font-size:19px!important;letter-spacing:0!important;line-height:1;color:#fff!important}
.pteam .pm{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);color:var(--ink)}
.gd{flex:none;width:8px;height:8px;border-radius:50%}.gd.L{background:#3E77C9}.gd.P{background:var(--acc)}
.guest{display:inline-block;margin-left:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold) 80%,var(--ink));vertical-align:1px}
.startp{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;margin:0 0 14px;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.sp-l{flex:1 1 260px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.cd.big{font-family:Rajdhani,Inter;font-size:30px;line-height:1;color:var(--acc);margin:0;text-transform:uppercase;letter-spacing:.5px}
.cd.big b{font-weight:700}
.tiles{flex:2 1 420px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--acc) 22%,var(--line))}
.tile b{display:block;font-family:Rajdhani,Inter;font-size:38px;font-weight:700;line-height:1;color:var(--acc)}
.tile b small{font-size:.5em;margin:0 2px;color:var(--mute)}
@media (max-width:600px){.startp{padding:14px;gap:12px}.cd.big{font-size:24px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex-basis:100%}.tile{padding:10px}.tile b{font-size:28px;white-space:nowrap}.tile b small{font-size:.45em}}
.tile span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:4px}
body.pc .findbar{max-width:520px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
input,select{font:inherit;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;width:100%}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:1px;border-color:transparent}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.small{padding:8px 12px;font-size:13px}
.teamchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.teamchips button.on{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.teamchips button.done small{color:var(--ok)}
.sgrid{width:100%;border-collapse:separate;border-spacing:0 6px;table-layout:fixed}
.sgrid col.c-n{width:30%}.sgrid col.c-t{width:13%}

.sgrid td{padding:0 2px}
.sgrid td.nm{font-size:13px;font-weight:700;line-height:1.2;padding-right:6px;overflow-wrap:anywhere}
.sgrid td.nm small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.sgrid input{padding:10px 0;text-align:center;font-size:17px;font-weight:700;min-width:0}
.sgrid input.saved{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
.sgrid input.err{border-color:var(--bad);color:var(--bad)}

  async setScore(id, g, val) {
    const now = Date.now(), key = `${id}/g${g}`;
    this.pending[key] = { v: val, at: now }; this._pendSave(); this.emit();
    try {
      await this.patch({ [`scores/${key}`]: val, updated: now });
      if (this.pending[key] && this.pending[key].at === now) { delete this.pending[key]; this._pendSave(); }
      this.emit();
    } catch (e) { delete this.pending[key]; this._pendSave(); this.emit(); throw e; }
  },
  // After a reload (e.g. phone was offline and the page was closed), send what didn't reach Firebase.
  resendPending() {
    const list = Object.entries(this.pending); if (!list.length || this.mode !== "firebase") return;
    list.forEach(([key, p]) => {
      const [id, gg] = key.split("/");
      this.setScore(id, +gg.slice(1), p.v).catch(() => {});
    });
    log(`re-sent ${list.length} score(s) saved on this phone while offline`);
  },
  async setLock(team, on) {
    return this.patch({ [`locks/${tkey(team)}`]: on ? { at: Date.now(), by: SCORER_NAME || (this.user && this.user.email) || "?" } : null });
  },
  async setLane(team, lane) { return this.patch({ [`lanes/${tkey(team)}`]: lane || null, updated: Date.now() }); },
  async sendFeedback(fb) {
    if (this.mode === "firebase") return this.db.ref("feedback").push({ ...fb, at: firebase.database.ServerValue.TIMESTAMP });
    let a = []; try { a = JSON.parse(localStorage.getItem("bowlFeedback") || "[]"); } catch (e) {}
    a.push({ ...fb, at: Date.now() }); try { localStorage.setItem("bowlFeedback", JSON.stringify(a)); } catch (e) {}
  },
  async setSetting(k, v) {
    if (this.mode === "firebase") await this.db.ref(`${DB_ROOT}/settings/${k}`).set(v);
    else { this.state.settings[k] = v; this._localSave(); }
  },
  async replaceScores(scores) {   // also clears all "Verified" locks (nothing left to verify)
    if (this.mode === "firebase") await this.db.ref(DB_ROOT).update({ scores, locks: null, updated: Date.now() });
    else { this.state.scores = scores; this.state.locks = {}; this.state.updated = Date.now(); this._localSave(); }
  },
  // list = full roster array [{id,n,t,g}]; drop = ids whose scores should be deleted
  // extra = more paths to write at the same time (e.g. moving a team's lock/lane when it is renamed)
  async saveRoster(list, drop = [], extra = {}) {
    const obj = {}; list.forEach((p, i) => { obj[p.id] = { n: p.n, t: p.t, g: p.g, o: i + 1 }; });
    const upd = { roster: obj, updated: Date.now(), ...extra };
    drop.forEach(id => { upd[`scores/${id}`] = null; });
    await this.patch(upd);
  },
  async setAnn(a) {
    if (this.mode === "firebase") await this.db.ref(`${DB_ROOT}/ann`).set(a);
    else { this.state.ann = a; this._localSave(); }
  },
  async login(pw, asAdmin) {
    if (this.mode !== "firebase") return true;
    if (!USE_LOGIN) {
      if (pw.trim() !== SCORER_PIN) throw { code: "wrong PIN" };
      try { sessionStorage.setItem("bowlPin", SCORER_PIN); } catch (e) {}
      this.user = { email: "PIN" }; this.emit(); return true;
    }
    await this.app.auth().signInWithEmailAndPassword(asAdmin ? ADMIN_EMAIL : SCORER_EMAIL, pw);
    return true;
  },
  logout() {
    if (this.mode !== "firebase") return;
    if (USE_LOGIN) this.app.auth().signOut();
    else { try { sessionStorage.removeItem("bowlPin"); } catch (e) {} this.user = null; this.emit(); }
  }
};

const isAdmin = () => !!(Store.user && Store.user.email === ADMIN_EMAIL);
// Activity log → logs/bowling (same place the other sports log to; Admin → Tools → Activity log)
function log(act) {
  if (Store.mode !== "firebase" || !Store.db) { console.info("[log]", act); return; }
  Store.db.ref(LOG_PATH).push({ act: String(act).slice(0, 300), no: "", m: "",
    by: (SCORER_NAME || (Store.user && Store.user.email || "?").split("@")[0]) + (isAdmin() ? " (admin)" : ""), dev: DEV, at: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
}

/* =================== calculations =================== */
// All ranking rules live in js/bowling-rules.js (shared with the admin page).
function compute(state) { return BowlRules.standings(ROSTER, state.scores, state.settings); }
const TITLES = Object.fromEntries(BowlRules.CATS.map(([k, l, sh]) => [k, { long: l, short: sh }]));
const shownCats = () => BowlRules.CATS.map(([k]) => k).filter(k => RULES.cats[k]);

/* =================== PUBLIC BOARD =================== */

  const ago = ts => { if (!ts) return "—"; const s = Math.round((Date.now() - ts) / 1000); return s < 15 ? "just now" : s < 60 ? s + " s ago" : Math.round(s / 60) + " min ago"; };

  };
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.t; try { localStorage.setItem("bolTab", tab); } catch (e) {} draw(); scrollTo({ top: 0 }); };

      <div class="grid2">
        <div class="field"><label>Event date</label><input id="rDate" type="date" value="${esc(last.settings.date || "")}"></div>
        <div class="field"><label>Start time</label><input id="rStart" type="time" value="${esc(last.settings.start || "")}"></div>
      </div>
      <div class="field"><label>Venue (shown on the public board)</label><input id="rVenue" maxlength="80" value="${esc(last.settings.venue || "")}" placeholder="e.g. Megalanes, Kota Kinabalu"></div>
      <div class="grid2">
        <div class="field"><label>Games per bowler</label><input id="rGames" type="number" inputmode="numeric" min="1" max="10" value="${R.games}"></div>
        <div class="field"><label>Women's handicap (pins / game)</label><input id="rHdc" type="number" inputmode="numeric" min="0" max="50" value="${R.hdcW}"></div>
      </div>
      <div class="warnline" id="rGamesWarn"></div>
      <div class="field"><label>Women's handicap counts in</label></div>
      <div class="cks">${ck("rHInd", R.hdcInd, "Individual totals", "Men / Women / Overall")}${ck("rHTeam", R.hdcTeam, "Team totals")}${ck("rHHigh", R.hdcHigh, "High Game & High Series")}</div>
      <div class="field" style="margin-top:14px"><label>Tie-break (same total pins)</label></div>
      <div class="cks">${Object.entries(BowlRules.TIES).map(([k, l]) => `<label class="ck"><input type="radio" name="rTie" value="${k}" ${R.tie === k ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>
      <div class="field" style="margin-top:14px"><label>Show on the public board &amp; big screen</label></div>
      <div class="cks">${BowlRules.CATS.map(([k, l]) => ck("rC_" + k, R.cats[k], l, k === "overall" ? "men and women together" : k === "series" ? "best run of games in a row" : "")).join("")}</div>
      <div class="field" id="rSerF" style="margin-top:10px;max-width:220px"><label>High Series length (games in a row)</label><input id="rSer" type="number" inputmode="numeric" min="1" max="10" value="${R.seriesN}"></div>
      <div class="rsum" id="rSum"></div>
      <div class="row2" style="margin-top:12px"><button class="btn" id="rSave" style="flex:1">Save rules</button><button class="btn ghost" id="rReset">Undo changes</button></div>
    </div>`;
    $("#pRules").dataset.maxScored = maxScored;
    previewRules();
  };
  const readRules = () => {
    const v = id => $("#" + id), cats = {};
    BowlRules.CATS.forEach(([k]) => { cats[k] = v("rC_" + k).checked; });
    return BowlRules.rules({ games: v("rGames").value, hdcW: v("rHdc").value || 0, hdcInd: v("rHInd").checked, hdcTeam: v("rHTeam").checked, hdcHigh: v("rHHigh").checked,
      tie: (document.querySelector('input[name="rTie"]:checked') || {}).value, seriesN: v("rSer").value, cats });
  };
  const previewRules = () => {
    if (!$("#rSum")) return;
    const r = readRules(), maxScored = +$("#pRules").dataset.maxScored || 0;
    $("#rSerF").classList.toggle("hide", !$("#rC_series").checked);
    $("#rGamesWarn").textContent = maxScored > r.games ? `⚠️ Some bowlers already have scores in G${r.games + 1}–G${maxScored}. They are kept, but hidden and not counted while games = ${r.games}.` : "";
    $("#rSum").textContent = "Summary: " + BowlRules.describe(r) + " Showing: " + BowlRules.CATS.filter(([k]) => r.cats[k]).map(([, l]) => l).join(", ") + ".";
  };
  $("#pRules").addEventListener("input", () => { rulesDirty = true; previewRules(); });
  $("#pRules").addEventListener("change", () => { rulesDirty = true; previewRules(); });
  $("#pRules").addEventListener("click", async e => {
    if (e.target.id === "rReset") return drawRules(true);
    if (e.target.id !== "rSave") return;
    const r = readRules(), old = RULES, title = $("#rTitle").value.replace(/\s+/g, " ").trim() || DEFAULT_TITLE;
    const tieL = k => BowlRules.TIES[k], onoff = b => (b ? "on" : "off");
    const changes = [];
    if (title !== (last.settings.title || DEFAULT_TITLE)) changes.push(`title → "${title}"`);
    const ev = { date: $("#rDate").value || "", start: $("#rStart").value || "", venue: $("#rVenue").value.replace(/\s+/g, " ").trim().slice(0, 80) };
    for (const k of ["date", "start", "venue"]) if (ev[k] !== (last.settings[k] || "")) changes.push(`${k} → ${ev[k] || "cleared"}`);
    if (r.games !== old.games) changes.push(`games ${old.games} → ${r.games}`);
    if (r.hdcW !== old.hdcW) changes.push(`women's handicap ${old.hdcW} → ${r.hdcW}`);
    if (r.hdcInd !== old.hdcInd) changes.push(`hdc in individual ${onoff(r.hdcInd)}`);
    if (r.hdcTeam !== old.hdcTeam) changes.push(`hdc in team ${onoff(r.hdcTeam)}`);
    if (r.hdcHigh !== old.hdcHigh) changes.push(`hdc in high game/series ${onoff(r.hdcHigh)}`);
    if (r.tie !== old.tie) changes.push(`tie-break → ${tieL(r.tie)}`);
    if (r.seriesN !== old.seriesN) changes.push(`high series ${old.seriesN} → ${r.seriesN} games`);
    BowlRules.CATS.forEach(([k, l]) => { if (r.cats[k] !== old.cats[k]) changes.push(`${l} ${r.cats[k] ? "shown" : "hidden"}`); });
    if (!changes.length) return toast("Nothing changed");
    if (r.games < old.games && (+$("#pRules").dataset.maxScored || 0) > r.games &&
        !confirm(`Change games from ${old.games} to ${r.games}?\n\nScores in G${r.games + 1} and later are kept but hidden and NOT counted.`)) return;
    try {
      e.target.disabled = true;
      const st = { title, date: ev.date || null, start: ev.start || null, venue: ev.venue || null, games: r.games, hdcW: r.hdcW, hdcInd: r.hdcInd, hdcTeam: r.hdcTeam, hdcHigh: r.hdcHigh, tie: r.tie, seriesN: r.seriesN, cats: r.cats };
      const upd = { updated: Date.now() }; for (const [k, v] of Object.entries(st)) upd["settings/" + k] = v;
      await Store.patch(upd);
      log("rules: " + changes.join("; "));
      toast("Rules saved ✓"); drawRules(true);
      if (team && !editing) drawGrid();       // number of game columns may have changed
    } catch (err) { e.target.disabled = false; toast("Failed: " + (err.code || err.message), true); }
  });

  /* ---------- verified lock ---------- */
  $("#grid").addEventListener("click", async e => {
    const b = e.target.closest("#lockT, #unlockT"); if (!b || !team) return;
    const on = b.id === "lockT";
    if (on && !confirm(`Lock ${team}?\n\nCheck every score with the team captain first. After locking, only the admin can unlock.`)) return;
    if (!on && !isAdmin()) return;
    try { await Store.setLock(team, on); log(`${team}: ${on ? "✓ verified & locked" : "unlocked"}`); toast(on ? "🔒 Team verified" : "Team unlocked"); }
    catch (err) { toast("Failed: " + (err.code || err.message), true); }
  });

  /* ---------- feedback ---------- */
  let fbType = "Suggestion";
  const closeFb = () => { $("#fbModal").innerHTML = ""; };
  $("#fbOpen").onclick = () => {
    $("#fbModal").innerHTML = `<div class="modal" id="fbBg"><div class="card"><b>💬 Feedback</b>
      <div style="color:var(--mute);font-size:12px;margin:2px 0 10px">Something not working, or an idea to make scoring easier? It goes straight to the organiser.</div>
      <div class="annq" id="fbTy">${["Bug", "Suggestion", "Other"].map(t => `<button type="button" data-ty="${t}" class="${t === fbType ? "on" : ""}">${t === "Bug" ? "🐞 " : t === "Suggestion" ? "💡 " : ""}${t}</button>`).join("")}</div>
      <textarea id="fbT" maxlength="500" placeholder="What happened, or what would help?"></textarea>
      <div style="color:var(--mute);font-size:11px;margin:4px 0 10px">Sent with your name (${esc(SCORER_NAME || "—")}), the time and device (${esc(DEV)}).</div>
      <div class="row2"><button class="btn" id="fbSend" style="flex:1">Send</button><button class="btn ghost" id="fbX">Cancel</button></div></div></div>`;
    $("#fbT").focus();
  };
  $("#fbModal").addEventListener("click", async e => {
    if (e.target.id === "fbBg" || e.target.id === "fbX") return closeFb();
    const ty = e.target.closest("[data-ty]");
    if (ty) { fbType = ty.dataset.ty; document.querySelectorAll("#fbTy button").forEach(x => x.classList.toggle("on", x === ty)); return; }
    if (e.target.id === "fbSend") {
      const msg = $("#fbT").value.trim(); if (!msg) return toast("Type a message first", true);
      e.target.disabled = true;
      try {
        await Store.sendFeedback({ type: fbType, msg: msg.slice(0, 500), sport: "bowling", page: "Bowling scorer",
          by: SCORER_NAME || "?", acct: (Store.user && Store.user.email) || "", dev: DEV, team: team || "" });
        closeFb(); toast("Thanks! Feedback sent ✓");
      } catch (err) { e.target.disabled = false; toast("Failed: " + (err.code || err.message), true); }
    }
  });

  /* ---------- edit team & player names ---------- */
  const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const startEdit = orig => {
    const mem = orig ? ROSTER.filter(p => p.t === orig) : [];
    editing = { orig, name: orig || "", rows: mem.map(p => ({ id: p.id, n: p.n, g: p.g, to: "", isNew: false, del: false })) };
    if (!orig) editing.rows.push({ id: newId(), n: "", g: "L", to: "", isNew: true, del: false });
    drawEdit();
    $("#grid").scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const readEdit = () => {
    if (!editing) return;
    editing.name = $("#eTeam").value;
    document.querySelectorAll("#grid .edrow").forEach(r => {
      const row = editing.rows.find(x => x.id === r.dataset.id); if (!row) return;
      row.n = r.querySelector(".eN").value; row.g = r.querySelector(".eG").value; row.to = r.querySelector(".eT").value;
    });
  };
  const drawEdit = () => {
    const others = TEAMS.filter(t => t !== editing.orig);
    const played = id => Object.keys(last.scores[id] || {}).length;
    $("#grid").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><b style="font-size:16px">${editing.orig ? "Edit team" : "New team"}</b><span style="color:var(--mute);font-size:12px">Scores are kept when names change</span></div>
      <div class="field"><label>Team name</label><input id="eTeam" maxlength="40" value="${esc(editing.name)}" placeholder="e.g. NGEKET"></div>
      <div class="field" style="margin-bottom:4px"><label>Players</label></div>
      <div class="edlist">${editing.rows.filter(r => !r.del).map(r => `
        <div class="edrow" data-id="${r.id}">
          <input class="eN" maxlength="60" value="${esc(r.n)}" placeholder="Player name">
          <select class="eG" aria-label="Gender"><option value="L" ${r.g === "L" ? "selected" : ""}>Male</option><option value="P" ${r.g === "P" ? "selected" : ""}>Female</option></select>
          <select class="eT" aria-label="Move to team"><option value="">This team</option>${others.map(t => `<option value="${esc(t)}" ${r.to === t ? "selected" : ""}>Move → ${esc(t)}</option>`).join("")}</select>
          <button class="btn ghost small eDel" title="Remove player" aria-label="Remove player">✕</button>
          ${!r.isNew && played(r.id) ? `<small class="edinfo">${played(r.id)} game${played(r.id) > 1 ? "s" : ""} scored</small>` : ""}
        </div>`).join("")}</div>
      <button class="btn ghost small" id="eAdd" style="margin:4px 0 14px">+ Add player</button>
      <div class="row2"><button class="btn" id="eSave" style="flex:1">Save changes</button><button class="btn ghost" id="eCancel">Cancel</button>
        ${editing.orig ? `<button class="btn ghost" id="eDelTeam" style="color:var(--bad)">Delete team</button>` : ""}</div>
      <div class="note" id="eErr" style="color:var(--bad)"></div>`;
  };
  const endEdit = () => { editing = null; $("#grid").innerHTML = ""; if (team) drawGrid(); else $("#grid").innerHTML = `<div class="empty">Choose a team above to enter scores.</div>`; draw(); };
  const saveEdit = async () => {
    readEdit();
    const err = m => { $("#eErr").textContent = m; };
    const name = editing.name.replace(/\s+/g, " ").trim();
    if (!name) return err("Please type a team name.");
    const clash = TEAMS.find(t => t !== editing.orig && t.toLowerCase() === name.toLowerCase());
    if (clash) return err(`There's already a team called "${clash}".`);
    const keep = editing.rows.filter(r => !r.del && r.n.trim());
    const stay = keep.filter(r => !r.to);
    if (!stay.length) return err("A team needs at least one player. Use Delete team to remove it.");
    const blank = editing.rows.filter(r => !r.del && !r.n.trim() && !r.isNew);
    if (blank.length) return err("A player name is empty. Type a name, or tap ✕ to remove that player.");
    const gone = editing.rows.filter(r => !r.isNew && r.del);
    const scored = gone.filter(r => Object.keys(last.scores[r.id] || {}).length);
    if (scored.length && !confirm(`Remove ${scored.map(r => r.n).join(", ")}?\n\nTheir scores will be deleted too.`)) return;
    const goneIds = new Set(gone.map(r => r.id));
    const byId = Object.fromEntries(keep.map(r => [r.id, r]));
    const list = [];
    ROSTER.forEach(p => {
      if (goneIds.has(p.id)) return;
      const r = byId[p.id];
      if (r) { list.push({ id: p.id, n: r.n.replace(/\s+/g, " ").trim(), g: r.g, t: r.to || name }); delete byId[p.id]; }
      else list.push({ id: p.id, n: p.n, g: p.g, t: p.t });
    });
    Object.values(byId).forEach(r => list.push({ id: r.id, n: r.n.replace(/\s+/g, " ").trim(), g: r.g, t: r.to || name }));
    try {
      $("#eSave").disabled = true;
      // a renamed team keeps its lane and Verified lock
      const extra = {};
      if (editing.orig && editing.orig !== name && tkey(editing.orig) !== tkey(name)) {
        extra[`locks/${tkey(editing.orig)}`] = null; extra[`lanes/${tkey(editing.orig)}`] = null;
        if (lockOf(editing.orig)) extra[`locks/${tkey(name)}`] = lockOf(editing.orig);
        if (laneOf(editing.orig)) extra[`lanes/${tkey(name)}`] = laneOf(editing.orig);
      }
      await Store.saveRoster(list, [...goneIds], extra);
      log(editing.orig ? `${editing.orig}: names edited${editing.orig !== name ? " (renamed → " + name + ")" : ""}${goneIds.size ? `, removed ${gone.map(r => r.n).join(", ")}` : ""}` : `new team ${name}`);
      team = name; try { sessionStorage.setItem("bolTeam", team); } catch (e) {}
      toast("Names saved ✓");
      endEdit();
    } catch (e) { $("#eSave").disabled = false; err("Save failed: " + (e.code || e.message)); }
  };
  $("#grid").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "editTeam") { if (lockOf(team) && !isAdmin()) return toast("Team is verified & locked – ask the admin to unlock", true); return startEdit(team); }
    if (!editing) return;
    if (b.id === "eAdd") { readEdit(); editing.rows.push({ id: newId(), n: "", g: "L", to: "", isNew: true, del: false }); drawEdit(); const ins = document.querySelectorAll("#grid .eN"); ins[ins.length - 1].focus(); return; }
    if (b.classList.contains("eDel")) { readEdit(); const row = editing.rows.find(x => x.id === b.closest(".edrow").dataset.id); if (row) row.del = true; drawEdit(); return; }
    if (b.id === "eCancel") return endEdit();
    if (b.id === "eSave") return saveEdit();
    if (b.id === "eDelTeam") {
      const ids = ROSTER.filter(p => p.t === editing.orig).map(p => p.id);
      const n = ids.reduce((a, id) => a + Object.keys(last.scores[id] || {}).length, 0);
      if (!confirm(`Delete team "${editing.orig}" and its ${ids.length} player(s)?` + (n ? `\n\n${n} game score(s) will be deleted too.` : ""))) return;
      try { await Store.saveRoster(ROSTER.filter(p => p.t !== editing.orig), ids, { [`locks/${tkey(editing.orig)}`]: null, [`lanes/${tkey(editing.orig)}`]: null }); log(`team ${editing.orig} deleted`); team = null; toast("Team deleted"); endEdit(); }
      catch (e2) { toast("Failed: " + (e2.code || e2.message), true); }
    }
  });
  $("#newTeam").onclick = () => { team = null; startEdit(null); };

  /* ---------- announcements (bowling2026/ann) ---------- */
  const ANN_QUICK = ["Next squad starts in 5 minutes", "Short break – bowling resumes in 10 minutes", "Calling team  to lanes ",
                     "Please submit your score sheet at the counter", "Final game is now on", "Results and prize giving coming soon"];
  const hm = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const drawAnn = () => {
    const el = $("#annCard"); if (!el || (annOpen && el.querySelector("textarea"))) return;
    const a = last.ann;
    if (annActive(a)) {
      el.innerHTML = `<div class="annbar"><div class="ic">📢</div><div class="tx"><b>${esc(a.t)}</b><small>On the big screen &amp; bowling board · ${a.exp ? "until " + hm(a.exp) : "until removed"}</small></div>
        <div class="act"><button class="btn ghost small" data-ann="edit">Change</button><button class="btn ghost small" data-ann="clear" style="color:var(--bad)">Remove</button></div></div>`;
    } else if (!annOpen) {
      el.innerHTML = `<button class="annbtn" data-ann="edit">📢 Make an announcement</button>`;
    }
  };
  const openAnnForm = () => {
    annOpen = true;
    const a = last.ann, cur = annActive(a) ? a.t : "";
    annMins = annActive(a) && !a.exp ? 0 : 30;
    $("#annCard").innerHTML = `<div class="card"><b>📢 Announcement</b><div style="color:var(--mute);font-size:12px;margin:2px 0 10px">Shows on the big screen and the bowling live board.</div>
      <div class="annq">${ANN_QUICK.map(q => `<button type="button">${esc(q)}</button>`).join("")}</div>
      <textarea id="annT" maxlength="140" rows="3" placeholder="e.g. Calling team NGEKET to lanes 5–6">${esc(cur)}</textarea>
      <div style="text-align:right;color:var(--mute);font-size:12px;margin:3px 0 8px" id="annC">${cur.length} / 140</div>
      <div class="field" style="margin-bottom:6px"><label>Show for</label></div>
      <div class="annq" id="annD">${[[10, "10 min"], [30, "30 min"], [60, "1 hour"], [0, "Until removed"]].map(([m, l]) => `<button type="button" data-m="${m}" class="${m === annMins ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="row2" style="margin-top:10px"><button class="btn" id="annPost" style="flex:1">${cur ? "Update" : "Post"} announcement</button><button class="btn ghost" id="annX">Cancel</button></div></div>`;
    $("#annT").focus();
  };
  $("#annCard").addEventListener("input", e => { if (e.target.id === "annT") $("#annC").textContent = e.target.value.length + " / 140"; });
  $("#annCard").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.ann === "edit") return openAnnForm();
    if (b.dataset.ann === "clear") {
      if (!confirm("Remove this announcement from the big screen and board?")) return;
      try { await Store.setAnn(null); log("announcement removed"); toast("Announcement removed"); } catch (e2) { toast("Failed: " + (e2.code || e2.message), true); }
      return;
    }
    if (b.id === "annX") { annOpen = false; $("#annCard").innerHTML = ""; return drawAnn(); }
    if (b.dataset.m !== undefined) { annMins = +b.dataset.m; document.querySelectorAll("#annD button").forEach(x => x.classList.toggle("on", x === b)); return; }
    if (b.closest(".annq") && !b.dataset.m) { const t = $("#annT"); t.value = b.textContent; $("#annC").textContent = t.value.length + " / 140"; t.focus(); const i = t.value.indexOf("  "); const p = i >= 0 ? i + 1 : t.value.length; t.setSelectionRange(p, p); return; }
    if (b.id === "annPost") {
      const t = $("#annT").value.replace(/\s+/g, " ").trim().slice(0, 140);
      if (!t) return toast("Type a message first", true);
      const at = Date.now();
      try { await Store.setAnn({ t, at, exp: annMins ? at + annMins * 60000 : 0 }); log("announce: " + t); annOpen = false; $("#annCard").innerHTML = ""; drawAnn(); toast("📢 Announcement posted"); }
      catch (e2) { toast("Failed: " + (e2.code || e2.message), true); }
    }
  });
  setInterval(() => { if (!annOpen) drawAnn(); }, 20000);
  Store.on(s => { last = s; draw(); });
}

/* =================== OBS OVERLAY =================== */
function viewOverlay() {
  document.body.classList.add("ov"); document.documentElement.setAttribute("data-theme", "dark");
  const fixed = params.get("show"), side = params.get("side") === "left" ? "left" : "";
  const secs = Math.max(5, +params.get("sec") || 12), N = Math.max(3, Math.min(12, +params.get("n") || 8));
  // rotates through the categories ticked in Tournament rules (or one fixed with &show=)
  const order = () => fixed && TITLES[fixed] ? [fixed] : shownCats();
  let idx = 0, last;
  $("#app").innerHTML = `<div class="ovp ${side}"><div class="ovh"><img src="img/dragon.jpg" alt=""><div><div class="k">Tenpin Bowling · HQ Games 2026</div><div class="t" id="ot"></div></div></div><div class="ovb"><div id="ol"></div><div class="ovf"><span id="of"></span><span><span class="jamark"></span><span id="ou"></span></span></div></div></div>`;
  const draw = () => {
    const c = compute(last), o = order(), k = o[idx % o.length];
    $("#ot").textContent = TITLES[k].long;
    let rows = "";
    if (k === "team") rows = c.teams.slice(0, N).map((t, i) => [c.rankOf(c.teams, i), t.t, `${t.done}/${t.slots} games`, t.total]);
    else if (k === "high") rows = c.highs.slice(0, N).map((p, i) => [c.rankOf(c.highs, i, "highT"), p.n, p.t, p.highT]);
    else if (k === "series") rows = c.series.slice(0, N).map((p, i) => [c.rankOf(c.series, i, "ser"), p.n, p.t, p.ser]);
    else { const l = c[k]; rows = l.slice(0, N).map((p, i) => [c.rankOf(l, i), p.n, p.t, p.total]); }
    $("#ol").innerHTML = c.anyScore ? rows.map((r, i) => `<div class="ovr r${r[0]}" style="animation-delay:${i * 60}ms"><div class="rk">${r[0]}</div><div class="nm">${esc(r[1])}<small>${esc(r[2])}</small></div><div class="sc num">${r[3]}</div></div>`).join("")
      : `<div class="ovr"><div></div><div class="nm" style="color:#9fb0d6">Waiting for first scores…</div><div></div></div>`;
    const hiTxt = c.R.hdcHigh && c.hdc ? `incl. women's hdc +${c.hdc}` : "Scratch";
    $("#of").textContent = k === "high" ? hiTxt : k === "series" ? `Best ${c.R.seriesN} games in a row · ${hiTxt}`
      : (c.hdc && (k === "team" ? c.R.hdcTeam : c.R.hdcInd) ? `TPF · women's hdc +${c.hdc}` : "TPF (total pinfall)");
    $("#ou").textContent = "Updated " + fmtTime(last.updated);
  };
  Store.on(s => { last = s; draw(); });
  setInterval(() => { if (order().length > 1) { idx++; draw(); } }, secs * 1000);
}
