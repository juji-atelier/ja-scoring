<script>
/* =================== helpers =================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const VIEW = (params.get("v") || location.hash.replace("#", "") || "board").toLowerCase();
const WIDE = matchMedia("(min-width:1100px)");
const TEAMS = [...new Set(ROSTER.map(p => p.t))];
const G = Array.from({ length: GAMES }, (_, i) => i + 1);
let toastT;
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast", 1600); }
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString("en-MY", { hour: "2-digit", minute: "2-digit" }) : "—";

/* =================== data store =================== */
// state = { scores: { b01: { g1: 180, ... } }, settings: { hdcW, title }, updated }
const Store = {
  mode: FIREBASE_CONFIG ? "firebase" : "local",
  state: { scores: {}, settings: { hdcW: 0, title: DEFAULT_TITLE }, updated: 0 },
  listeners: [], online: null, user: null,
  on(cb) { this.listeners.push(cb); cb(this.state); },
  emit() { this.listeners.forEach(cb => cb(this.state)); },
  merge(v) {
    v = v || {};
    this.state = { scores: v.scores || {}, settings: Object.assign({ hdcW: 0, title: DEFAULT_TITLE }, v.settings || {}), updated: v.updated || 0 };
    this.emit();
  },
  init() {
    if (this.mode === "firebase" && VIEW !== "scorer" && VIEW !== "overlay") {
      // Public board: check for new scores every few seconds over plain HTTPS
      // instead of a live connection, so spectators don't use up the free plan's
      // ~100 connection limit (scorers + OBS keep their live connection).
      const url = FIREBASE_CONFIG.databaseURL.replace(/\/$/, "") + "/" + DB_ROOT + ".json";
      let timer = null, lastJSON = "";
      const poll = async () => {
        clearTimeout(timer);
        if (document.hidden) return;                       // pause while the phone screen is off / tab hidden
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) throw new Error(r.status);
          const txt = await r.text();
          this.online = true;
          if (txt !== lastJSON) { lastJSON = txt; this.merge(JSON.parse(txt)); } else this.emit();
        } catch (e) { this.online = false; this.emit(); }
        timer = setTimeout(poll, POLL_MS);
      };
      document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
      poll();
      return;
    }
    if (this.mode === "firebase") {
      this.app = firebase.initializeApp(FIREBASE_CONFIG, "ja-bowling"); // own login, separate from admin & other sports
      this.db = this.app.database();
      this.db.ref(DB_ROOT).on("value", s => this.merge(s.val()));
      this.db.ref(".info/connected").on("value", s => { this.online = !!s.val(); this.emit(); });
      if (USE_LOGIN) this.app.auth().onAuthStateChanged(u => { this.user = u; this.emit(); });
      else { let ok = false; try { ok = sessionStorage.getItem("bowlPin") === SCORER_PIN; } catch (e) {} this.user = ok ? { email: "PIN" } : null; }
    } else {
      const load = () => { try { this.merge(JSON.parse(localStorage.getItem(DB_ROOT) || "{}")); } catch (e) { this.merge({}); } };
      addEventListener("storage", e => { if (e.key === DB_ROOT) load(); });
      this.online = true; this.user = { local: true }; load();
    }
  },
  _localSave() { try { localStorage.setItem(DB_ROOT, JSON.stringify(this.state)); } catch (e) {} this.emit(); },
  async setScore(id, g, val) {
    const now = Date.now();
    if (this.mode === "firebase") {
      await this.db.ref().update({ [`${DB_ROOT}/scores/${id}/g${g}`]: val, [`${DB_ROOT}/updated`]: now });
    } else {
      const s = this.state.scores[id] = this.state.scores[id] || {};
      if (val === null) delete s["g" + g]; else s["g" + g] = val;
      this.state.updated = now; this._localSave();
    }
  },
  async setSetting(k, v) {
    if (this.mode === "firebase") await this.db.ref(`${DB_ROOT}/settings/${k}`).set(v);
    else { this.state.settings[k] = v; this._localSave(); }
  },
  async replaceScores(scores) {
    if (this.mode === "firebase") await this.db.ref(DB_ROOT).update({ scores, updated: Date.now() });
    else { this.state.scores = scores; this.state.updated = Date.now(); this._localSave(); }
  },
  async login(pw) {
    if (this.mode !== "firebase") return true;
    if (!USE_LOGIN) {
      if (pw.trim() !== SCORER_PIN) throw { code: "wrong PIN" };
      try { sessionStorage.setItem("bowlPin", SCORER_PIN); } catch (e) {}
      this.user = { email: "PIN" }; this.emit(); return true;
    }
    await this.app.auth().signInWithEmailAndPassword(SCORER_EMAIL, pw);
    return true;
  },
  logout() {
    if (this.mode !== "firebase") return;
    if (USE_LOGIN) this.app.auth().signOut();
    else { try { sessionStorage.removeItem("bowlPin"); } catch (e) {} this.user = null; this.emit(); }
  }
};

/* =================== calculations =================== */
function compute(state) {
  const hdc = +state.settings.hdcW || 0;
  const players = ROSTER.map(p => {
    const sc = state.scores[p.id] || {};
    const games = G.map(g => (typeof sc["g" + g] === "number" ? sc["g" + g] : null));
    const played = games.filter(x => x !== null);
    const scratch = played.reduce((a, b) => a + b, 0);
    const h = p.g === "P" ? hdc * played.length : 0;
    return { ...p, games, played: played.length, scratch, hdc: h, total: scratch + h,
      avg: played.length ? scratch / played.length : 0, high: played.length ? Math.max(...played) : 0 };
  });
  const teams = TEAMS.map(t => {
    const mem = players.filter(p => p.t === t);
    const games = G.map((g, i) => { const v = mem.map(m => m.games[i]); return v.every(x => x === null) ? null : v.reduce((a, b) => a + (b || 0) + 0, 0) + mem.reduce((a, m) => a + (m.g === "P" && m.games[i] !== null ? hdc : 0), 0); });
    const total = mem.reduce((a, m) => a + m.total, 0);
    const done = mem.reduce((a, m) => a + m.played, 0);
    return { t, mem, games, total, done, slots: mem.length * GAMES, high: Math.max(0, ...games.filter(x => x !== null)) };
  });
  // ranking: total desc, then best single game desc, then name
  const byTot = (a, b) => b.total - a.total || b.high - a.high || (a.n || a.t).localeCompare(b.n || b.t);
  teams.sort(byTot);
  const men = players.filter(p => p.g === "L").sort(byTot);
  const women = players.filter(p => p.g === "P").sort(byTot);
  const highs = players.filter(p => p.played).sort((a, b) => b.high - a.high || b.total - a.total);
  return { hdc, players, teams, men, women, highs, anyScore: players.some(p => p.played) };
}
function rankOf(list, i, key = "total") { // shared rank for exact ties (same total + same high)
  let r = i; while (r > 0 && list[r - 1][key] === list[i][key] && list[r - 1].high === list[i].high) r--; return r + 1;
}

function viewBoard() {
  const app = $("#app");
  let tab = "team", open = new Set();
  try { tab = localStorage.getItem("bolTab") || "team"; } catch (e) {}
  app.innerHTML = `
    <header class="bh"><div class="in">
      <img class="logo-dragon" src="img/dragon.jpg" alt="HQ Dragon">
      <div class="brand"><b>HQ Games 2026</b><small>Tenpin Bowling · Live</small></div>
      <div class="sp"></div>
      <img class="logo-org" src="img/sesb.png" alt="Sabah Electricity">
      <div data-theme-toggle></div>
    </div></header>
    <div class="wrap">
      <section class="hero"><h1 id="ttl"></h1>
        <div class="sub"><span class="dot" id="dot"></span><span id="st">Connecting…</span><span>·</span><span>Updated <b id="upd" class="num">—</b></span><span class="pill" id="mode"></span></div></section>
      <div class="tabs" id="tabs">
        <button data-t="team">Teams</button><button data-t="men">Men</button>
        <button data-t="women">Women</button><button data-t="high">High Game</button>

      <div class="list" id="list"></div><div class="note" id="note"></div></div>
    <footer class="jafoot"><span class="jamark"></span>Powered by JUJI-ATELIER</footer>`;
  let last;
  const draw = () => {
    const c = compute(last), s = last.settings;
    $("#ttl").textContent = s.title || DEFAULT_TITLE;
    $("#upd").textContent = fmtTime(last.updated);
    $("#dot").className = "dot " + (Store.online ? "on" : "off");
    $("#st").textContent = Store.online ? "Live" : "No connection";
    $("#mode").textContent = Store.mode === "local" ? "TEST MODE" : `${GAMES} games`;
    $("#mode").style.display = Store.mode === "local" ? "" : "none";
    [...$("#tabs").children].forEach(b => b.classList.toggle("on", b.dataset.t === tab));
    const L = $("#list");
    const hdcTxt = c.hdc ? ` Women's handicap: +${c.hdc} pins per game (included in totals).` : "";
    const wide = WIDE.matches;
    document.body.classList.toggle("pc", wide);
    if (!c.anyScore) { L.innerHTML = `<div class="empty">No scores yet. This page updates automatically.</div>`; $("#note").textContent = ""; return; }
    const gamesHTML = arr => `<div class="games num">${arr.map((v, i) => `<span class="${v === null ? "e" : ""}">${v === null ? "G" + (i + 1) : v}</span>`).join("")}</div>`;
    const section = k => {
      if (k === "team") return c.teams.map((t, i) => { const r = rankOf(c.teams, i); return `
        <div class="row click r${r}" data-team="${esc(t.t)}">
          <div class="rk num">${r}</div>
          <div><div class="nm">${esc(t.t)}</div><div class="meta"><span>${t.done}/${t.slots} games done</span>${t.high ? `<span>Best game ${t.high}</span>` : ""}</div>${gamesHTML(t.games)}</div>
          <div class="tot num"><b>${t.total}</b><small>TPF</small></div>
          ${open.has(t.t) ? `<div class="members">${t.mem.map(m => `<div class="mem"><div>${esc(m.n)}<span class="tg ${m.g}">${m.g === "P" ? "F" : "M"}</span>${gamesHTML(m.games)}</div><div class="num"><b>${m.total}</b></div></div>`).join("")}</div>` : ""}
        </div>`; }).join("");
      if (k === "high") return c.highs.slice(0, wide ? 10 : 20).map((p, i) => `
        <div class="row r${i + 1}"><div class="rk num">${i + 1}</div>
          <div><div class="nm">${esc(p.n)} <span class="tg ${p.g}">${p.g === "P" ? "F" : "M"}</span></div><div class="meta"><span>${esc(p.t)}</span></div></div>
          <div class="tot num"><b>${p.high}</b><small>scratch</small></div></div>`).join("");
      const list = c[k].filter(p => p.played);
      return list.length ? list.map((p, i) => { const r = rankOf(list, i); return `
        <div class="row r${r}"><div class="rk num">${r}</div>
          <div><div class="nm">${esc(p.n)}</div><div class="meta"><span>${esc(p.t)}</span><span>Avg ${p.avg.toFixed(1)}</span>${p.hdc ? `<span>+${p.hdc} hdc</span>` : ""}</div>${gamesHTML(p.games)}</div>
          <div class="tot num"><b>${p.total}</b><small>${p.played}/${GAMES} games</small></div></div>`; }).join("")
        : `<div class="empty">No scores yet.</div>`;
    };
    if (wide) {
      const H = { team: "Team Standings", men: "Men's Individual", women: "Women's Individual", high: "High Game" };
      L.innerHTML = `<div class="cols">${["team", "men", "women", "high"].map(k => `<section class="col"><h2>${H[k]}</h2><div class="list">${section(k)}</div></section>`).join("")}</div>`;

      return;
    }
    L.innerHTML = section(tab);
    $("#note").textContent = tab === "team" ? "Tap a team to see each member's scores. Ties are broken by the highest team game." + hdcTxt
      : tab === "high" ? "Highest single game (scratch, no handicap)." : "Ties are broken by the highest single game." + hdcTxt;
  };
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.t; try { localStorage.setItem("bolTab", tab); } catch (e) {} draw(); scrollTo({ top: 0 }); };
  $("#list").onclick = e => { const r = e.target.closest("[data-team]"); if (!r) return; const t = r.dataset.team; open.has(t) ? open.delete(t) : open.add(t); draw(); };
  WIDE.addEventListener("change", () => last && draw());
  Store.on(s => { last = s; draw(); });
}

/* =================== SCORER =================== */
function viewScorer() {
  if (window.jaKeepAwake) jaKeepAwake();   // stop the phone sleeping during games
  const app = $("#app");
  let team = null, last = Store.state;
  try { team = sessionStorage.getItem("bolTeam"); } catch (e) {}
  app.innerHTML = `
    <header class="bh"><div class="in">
      <img class="logo-dragon" src="img/dragon.jpg" alt="HQ Dragon">
      <div class="brand"><b>HQ Games 2026</b><small>Bowling · Score entry</small></div>
      <div class="sp"></div>
      <div data-clock></div>
      <img class="logo-org" src="img/sesb.png" alt="Sabah Electricity">
      <div data-theme-toggle></div>
    </div></header>
    <div class="wrap">
      <section class="hero"><h1>Bowling score entry</h1>
        <div class="sub"><span class="dot" id="dot"></span><span id="st"></span><span class="pill" id="mode"></span><span style="flex:1"></span><a href="?v=board" target="_blank">Open public board ↗</a></div></section>
      <div id="login" class="card hide">
        <div class="field"><label>${USE_LOGIN ? "Bowling committee password" : "Bowling committee PIN"}</label><input id="pw" type="password" autocomplete="off"></div>
        <button class="btn" id="go" style="width:100%">Sign in</button>
        <div class="note" id="lerr"></div>
      </div>
      <div id="main" class="hide">
        <div class="card"><div style="font-size:12px;color:var(--mute);margin-bottom:8px">Choose a team</div><div class="teamchips" id="chips"></div></div>
        <div class="card" id="grid"><div class="empty">Choose a team above to enter scores.</div></div>
        <details class="card"><summary style="cursor:pointer;font-weight:700">Settings & export</summary>
          <div style="margin-top:12px">
            <div class="field"><label>Tournament title</label><input id="sTitle"></div>
            <div class="field"><label>Women's handicap (pins per game, 0 = none)</label><input id="sHdc" type="number" inputmode="numeric" min="0" max="50"></div>
            <div class="row2"><button class="btn small" id="save">Save settings</button><button class="btn ghost small" id="csv">Download results (CSV/Excel)</button>
            <button class="btn ghost small" id="demo">Fill sample scores</button><button class="btn ghost small" id="wipe" style="color:var(--bad)">Delete all scores</button><button class="btn ghost small" id="out">Sign out</button></div>
          </div></details>
      </div>
    </div>
    <footer class="jafoot"><span class="jamark"></span>Powered by JUJI-ATELIER</footer>`;
  const authed = () => !!Store.user;
  const drawChips = c => {
    $("#chips").innerHTML = c.teamsAlpha.map(t => `<button data-t="${esc(t.t)}" class="${t.t === team ? "on" : ""} ${t.done === t.slots ? "done" : ""}">${esc(t.t)}<small class="num">${t.done}/${t.slots} · ${t.total}</small></button>`).join("");
  };
  const drawGrid = () => {
    if (!team) return;
    const mem = ROSTER.filter(p => p.t === team);
    $("#grid").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><b style="font-size:16px">${esc(team)}</b><span style="color:var(--mute);font-size:12px">0–300 · clear a box to delete</span></div>
      <table class="sgrid"><colgroup><col class="c-n">${G.map(()=>"<col>").join("")}<col class="c-t"></colgroup><thead><tr><th>Name</th>${G.map(g => `<th>G${g}</th>`).join("")}<th style="text-align:right">TPF</th></tr></thead>
      <tbody>${mem.map(p => `<tr data-id="${p.id}"><td class="nm">${esc(p.n)}<small>${p.g === "P" ? "Female" : "Male"}</small></td>
        ${G.map(g => `<td><input class="num" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-id="${p.id}" data-g="${g}"></td>`).join("")}<td class="t num" data-tot="${p.id}"></td></tr>`).join("")}
      <tr class="sum"><td style="text-align:left">Team</td>${G.map(g => `<td class="num" data-gt="${g}"></td>`).join("")}<td class="num" style="text-align:right" id="teamTot"></td></tr></tbody></table>`;
    fillGrid();
  };
  const fillGrid = () => {
    if (!team || !$("#grid input")) return;
    const c = compute(last), t = c.teams.find(x => x.t === team);
    document.querySelectorAll("#grid input").forEach(inp => {
      if (inp === document.activeElement) return;
      const v = (last.scores[inp.dataset.id] || {})["g" + inp.dataset.g];
      inp.value = typeof v === "number" ? v : "";
      inp.classList.remove("err");
    });
    t.mem.forEach(m => { const el = $(`[data-tot="${m.id}"]`); if (el) el.textContent = m.played ? m.total : ""; });
    G.forEach((g, i) => { $(`[data-gt="${g}"]`).textContent = t.games[i] ?? ""; });
    $("#teamTot").textContent = t.total || "";
  };
  const draw = () => {
    $("#dot").className = "dot " + (Store.online ? "on" : "off");
    $("#st").textContent = Store.online ? "Connected" : "No connection — scores will send when internet returns";
    $("#mode").textContent = Store.mode === "local" ? "TEST MODE (saved in this browser only)" : (Store.user && Store.user.email !== "PIN" ? "Signed in: " + Store.user.email : "");
    $("#login").classList.toggle("hide", authed());
    $("#main").classList.toggle("hide", !authed());
    $("#demo").classList.toggle("hide", Store.mode !== "local");
    if (!authed()) return;
    const c = compute(last); c.teamsAlpha = TEAMS.map(n => c.teams.find(t => t.t === n));
    drawChips(c);
    if (team && !$("#grid input")) drawGrid(); else fillGrid();
    if (document.activeElement !== $("#sTitle")) $("#sTitle").value = last.settings.title || DEFAULT_TITLE;
    if (document.activeElement !== $("#sHdc")) $("#sHdc").value = last.settings.hdcW || 0;
  };
  const commit = async inp => {
    const raw = inp.value.trim(); const id = inp.dataset.id, g = +inp.dataset.g;
    const cur = (last.scores[id] || {})["g" + g];
    if (raw === "" && typeof cur !== "number") return;
    let val = null;
    if (raw !== "") { val = Number(raw); if (!Number.isInteger(val) || val < 0 || val > 300) { inp.classList.add("err"); toast("Score must be 0 to 300", true); return; } }
    if (val === cur) return;
    inp.classList.remove("err");
    try { await Store.setScore(id, g, val); inp.classList.add("saved"); setTimeout(() => inp.classList.remove("saved"), 900); toast(val === null ? "Deleted" : "Saved ✓"); }
    catch (e) { inp.classList.add("err"); toast("Save failed: " + (e.code || e.message), true); }
  };
  $("#chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; team = b.dataset.t; try { sessionStorage.setItem("bolTeam", team); } catch (e) {} drawGrid(); draw(); $("#grid").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("#grid").addEventListener("change", e => { if (e.target.matches("input")) commit(e.target); });
  $("#grid").addEventListener("keydown", e => {
    if (e.key !== "Enter" || !e.target.matches("input")) return;
    e.preventDefault(); const all = [...document.querySelectorAll("#grid input")]; const i = all.indexOf(e.target);
    commit(e.target); // move down the same game column, then to next column
    const per = GAMES, row = Math.floor(i / per), col = i % per, rows = all.length / per;
    const next = row + 1 < rows ? all[(row + 1) * per + col] : all[col + 1];
    next && next.focus(); next && next.select();
  });
  $("#grid").addEventListener("input", e => { if (e.target.matches("input")) e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3); });
  $("#go").onclick = async () => {
    $("#lerr").textContent = "";
    try { await Store.login($("#pw").value); } catch (e) { $("#lerr").textContent = (USE_LOGIN ? "Wrong password" : "Wrong PIN") + " or no connection. (" + (e.code || e.message) + ")"; }
  };
  $("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
  $("#save").onclick = async () => {
    const h = Math.max(0, Math.min(50, parseInt($("#sHdc").value || "0", 10) || 0));
    try { await Store.setSetting("hdcW", h); await Store.setSetting("title", $("#sTitle").value.trim() || DEFAULT_TITLE); toast("Settings saved ✓"); } catch (e) { toast("Failed: " + (e.code || e.message), true); }
  };
  $("#csv").onclick = () => {
    const c = compute(last); const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [["NAME", "TEAM", "GENDER (L=M, P=F)", ...G.map(g => "G" + g), "SCRATCH", "HANDICAP", "TPF", "AVERAGE", "HIGH GAME"]];
    c.players.forEach(p => rows.push([p.n, p.t, p.g, ...p.games.map(x => x ?? ""), p.scratch, p.hdc, p.total, p.played ? p.avg.toFixed(2) : "", p.high || ""]));
    rows.push([]); rows.push(["TEAM STANDINGS"]); rows.push(["RANK", "TEAM", ...G.map(g => "G" + g), "TPF"]);
    c.teams.forEach((t, i) => rows.push([rankOf(c.teams, i), t.t, ...t.games.map(x => x ?? ""), t.total]));
    const blob = new Blob(["﻿" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "SESB_Bowling_2026_Results.csv"; a.click();
  };
  $("#demo").onclick = async () => {
    const sc = {}; ROSTER.forEach(p => { sc[p.id] = {}; G.forEach(g => { if (Math.random() < .85) sc[p.id]["g" + g] = Math.round(Math.max(60, Math.min(279, (p.g === "L" ? 150 : 128) + (Math.random() - .5) * 110))); }); });
    await Store.replaceScores(sc); toast("Sample scores added");
  };
  $("#wipe").onclick = async () => {
    const w = prompt('Type DELETE to remove ALL bowling scores.'); if (w !== "DELETE") return;
    try { await Store.replaceScores({}); toast("All scores deleted"); } catch (e) { toast("Failed: " + (e.code || e.message), true); }
  };
  $("#out").onclick = () => Store.logout();
  Store.on(s => { last = s; draw(); });
}

/* =================== OBS OVERLAY =================== */
function viewOverlay() {
  document.body.classList.add("ov"); document.documentElement.setAttribute("data-theme", "dark");
  const fixed = params.get("show"), side = params.get("side") === "left" ? "left" : "";
  const secs = Math.max(5, +params.get("sec") || 12), N = Math.max(3, Math.min(12, +params.get("n") || 8));
  const order = fixed ? [fixed] : ["team", "men", "women", "high"];
  const titles = { team: "Team Standings", men: "Men's Individual", women: "Women's Individual", high: "High Game" };
  let idx = 0, last;
  $("#app").innerHTML = `<div class="ovp ${side}"><div class="ovh"><img src="img/dragon.jpg" alt=""><div><div class="k">Tenpin Bowling · HQ Games 2026</div><div class="t" id="ot"></div></div></div><div class="ovb"><div id="ol"></div><div class="ovf"><span id="of"></span><span><span class="jamark"></span><span id="ou"></span></span></div></div></div>`;
  const draw = () => {
    const c = compute(last), k = order[idx % order.length];
    $("#ot").textContent = titles[k] || titles.team;
    let rows = "";
    if (k === "team") rows = c.teams.slice(0, N).map((t, i) => [rankOf(c.teams, i), t.t, `${t.done}/${t.slots} games`, t.total]);
    else if (k === "high") rows = c.highs.slice(0, N).map((p, i) => [i + 1, p.n, p.t, p.high]);
    else { const l = c[k].filter(p => p.played); rows = l.slice(0, N).map((p, i) => [rankOf(l, i), p.n, p.t, p.total]); }
    $("#ol").innerHTML = c.anyScore ? rows.map((r, i) => `<div class="ovr r${r[0]}" style="animation-delay:${i * 60}ms"><div class="rk">${r[0]}</div><div class="nm">${esc(r[1])}<small>${esc(r[2])}</small></div><div class="sc num">${r[3]}</div></div>`).join("")
      : `<div class="ovr"><div></div><div class="nm" style="color:#9fb0d6">Waiting for first scores…</div><div></div></div>`;
    $("#of").textContent = k === "high" ? "Scratch" : (c.hdc ? `TPF · women's hdc +${c.hdc}` : "TPF (total pinfall)");
    $("#ou").textContent = "Updated " + fmtTime(last.updated);
  };
  Store.on(s => { last = s; draw(); });
  if (order.length > 1) setInterval(() => { idx++; draw(); }, secs * 1000);
}

/* =================== boot =================== */
Store.init();
({ scorer: viewScorer, overlay: viewOverlay }[VIEW] || viewBoard)();
