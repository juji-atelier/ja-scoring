<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#F6F4F2">
<title>Mobile Legends · Live Standings</title>
<link rel="stylesheet" href="css/theme.css?v=20261113k">
<script src="js/theme.js?v=20261113k"></script>
<style>
:root{--sport:#f59e0b;--ga:#D23A3A;--gb:#2F6FE0}
*{box-sizing:border-box}
html,body{margin:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.hd{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:12px;height:66px}
.hd .brand b{display:block;font-family:Rajdhani,Inter;font-size:22px;letter-spacing:1.4px;line-height:1;text-transform:uppercase}
.hd .brand small{color:var(--mute);font-size:12px}
.hd .sp{flex:1}
.hero{background:linear-gradient(120deg,#1b2a4a,#0f1a30 60%,#3a1020);color:#fff;border-radius:22px;margin:18px 0 14px;padding:22px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(#f59e0b33,transparent 65%)}
.hero h1{margin:0;font-family:Rajdhani,Inter;font-size:36px;letter-spacing:1px;line-height:1;text-transform:uppercase;position:relative}
.hero p{margin:6px 0 0;opacity:.88;font-size:14px;position:relative}
.hero .pill{display:inline-block;margin-top:10px;background:#ffffff1f;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;position:relative}
nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav.sgrid{overflow:visible;flex-wrap:nowrap;padding:0}
nav.sgrid a:before{content:none}
nav.sgrid a small{display:block}
@media(min-width:700px){nav{flex-wrap:wrap;overflow:visible}}
nav a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;line-height:1.1}
nav a:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc));flex:none}
nav a.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
nav a.on:before{background:#fff}
.sub{display:flex;gap:4px;margin:12px 0 4px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:14px}
.sub button{flex:1;font:inherit;font-weight:600;font-size:13px;color:var(--mute);background:none;border:0;border-radius:10px;padding:9px 6px;cursor:pointer}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:22px 2px 10px;display:flex;align-items:center;gap:10px;font-weight:700}
h2 .gtag{color:#fff;border-radius:6px;padding:3px 8px;letter-spacing:.1em}
.empty{color:var(--mute);padding:12px 2px;font-size:14px}
.donebar{margin:4px 0 10px;padding:10px 14px;border-radius:12px;font-size:14px;background:color-mix(in srgb,#16a34a 16%,var(--card));border:1px solid color-mix(in srgb,#16a34a 45%,var(--line))}
.upd{font-size:12px;color:var(--mute);text-align:right;margin-top:6px}
/* table */
.tw{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tw.A{border-top:4px solid var(--ga)}.tw.B{border-top:4px solid var(--gb)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;background:var(--bg2)}
td.t,th.t{text-align:left}
td.rk{width:30px;font-weight:800;color:var(--mute)}
td.t .tc{display:flex;align-items:center;gap:8px;min-width:0}
td.t .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.slot{font-size:10px;font-weight:800;color:#fff;border-radius:4px;padding:2px 5px;flex:none}
.A .slot{background:var(--ga)}.B .slot{background:var(--gb)}
.lg{width:24px;height:24px;border-radius:6px;object-fit:contain;flex:none;background:var(--bg2)}
td.pts b{display:inline-block;min-width:30px;border-radius:7px;padding:3px 0;background:var(--bg2)}
tr.q td{background:color-mix(in srgb,var(--gold) 12%,var(--card))}
tr.q td.pts b{background:var(--gold);color:#fff}
tr.cut td{border-bottom:2px dashed var(--gold)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.form i.W{background:var(--ok)}.form i.L,.form i.WO{background:var(--bad)}
.live-ann{display:flex;gap:12px;align-items:center;margin:4px 0 12px;padding:13px 15px;border-radius:14px;background:linear-gradient(100deg,#9b0f22,#e2394d);color:#fff;box-shadow:var(--shadow)}
.live-ann .ai{font-size:26px;line-height:1}.live-ann b{display:block;font-size:15px;letter-spacing:.04em}.live-ann small{display:block;font-size:12px;opacity:.9;margin-top:2px}
.live-ann a{display:inline-block;margin-top:6px;background:#fff;color:#9b0f22;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;text-decoration:none;word-break:break-all}
.lvtag{background:var(--live);color:#fff;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:800;letter-spacing:.06em}
.pend{background:#ffb020;color:#1a1200;border-radius:6px;padding:3px 8px;letter-spacing:.06em}
.pendbox{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#ffb020 16%,var(--card));border:1px solid color-mix(in srgb,#ffb020 60%,var(--line));font-size:14px;line-height:1.4}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:12px;margin:10px 2px}
@media(max-width:600px){.wrap{padding:0 12px}.hd .wrap{height:60px;gap:8px}.hd .brand b{font-size:18px}.hd .brand small{display:none}.logo-org{height:16px}.logo-dragon{width:36px;height:36px}
  .hero{padding:20px}.hero h1{font-size:28px}.hide-s{display:none}th,td{padding:8px 4px}table{font-size:13px}}
/* matches */
.m{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:var(--shadow)}
.m .meta{display:flex;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px;align-items:center}
.m .meta .st{margin-left:auto;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.m.live .meta .st{color:var(--live)}
.r{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:4px 0}
.r .n{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.r .b{font-size:24px;font-weight:800;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.r .k{font-size:12px;color:var(--mute);font-weight:600}
.r.win .n:after{content:"✓";color:var(--gold);font-size:13px}
.r.win .b{color:var(--acc)}
.r .sl{font-size:10px;font-weight:800;color:#fff;border-radius:4px;padding:2px 5px}
.sl.A{background:var(--ga)}.sl.B{background:var(--gb)}
.champ{margin:14px 0 4px;border-radius:18px;padding:16px 18px;color:#fff;background:linear-gradient(120deg,#6f5220,#a8823f 55%,#6f5220);box-shadow:var(--shadow)}
.champ .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.champ .w{font-family:Rajdhani,Inter;font-size:30px;font-weight:700;line-height:1.05;text-transform:uppercase;margin:4px 0 8px}
.champ .o{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;font-weight:600;opacity:.95}
/* iPhone zooms into text boxes under 16px */
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:max(16px,1em)!important}}
/* ---------- moving background glow ---------- */
/* Two soft blobs on their own fixed layers, moved with transform only (GPU, no repaint). */
html{background:var(--bg)}body{background:transparent}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;will-change:transform}
body::before{inset:-25% -25% auto -25%;height:90vh;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--gb) 20%, transparent), transparent);
  animation:jaDriftA 26s ease-in-out infinite alternate}
body::after{width:70vmax;height:70vmax;right:-30vmax;top:30vh;border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--ga) 12%, transparent), transparent);
  animation:jaDriftB 34s ease-in-out infinite alternate}
html[data-theme="dark"] body::before{background:radial-gradient(closest-side, color-mix(in srgb, var(--gb) 32%, transparent), transparent)}
html[data-theme="dark"] body::after{background:radial-gradient(closest-side, color-mix(in srgb, var(--ga) 20%, transparent), transparent)}
@keyframes jaDriftA{0%{transform:translate3d(-12%,-6%,0) scale(1)}50%{transform:translate3d(8%,2%,0) scale(1.12)}100%{transform:translate3d(14%,-4%,0) scale(.95)}}
@keyframes jaDriftB{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-45vw,22vh,0) scale(1.25)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
/* ---------- big faded JA watermark on the right of the title card ---------- */
.hero:before{content:"";position:absolute;right:-2.5%;top:50%;height:104%;width:auto;aspect-ratio:140/79;transform:translateY(-50%) rotate(-6deg);background:#fff;opacity:.09;pointer-events:none;-webkit-mask:url(img/ja.svg) center/contain no-repeat;mask:url(img/ja.svg) center/contain no-repeat}
@media(max-width:600px){.hero:before{width:200px;height:114px;right:-40px;opacity:.08}}
</style>
<script src="js/splash.js?v=20261113k"></script>
</head>
<body>
<header class="hd"><div class="wrap">
  <img class="logo-dragon" src="img/dragon.jpg" alt="HQ Dragon">
  <div class="brand"><b id="ev">HQ Games 2026</b><small id="venue">📍 Centralized Meeting Room, Block E, Tingkat 1, Bangunan KWSP</small></div>
  <div class="sp"></div>
  <div data-clock></div>
  <img class="logo-org" src="img/sabah-electricity.png" alt="Sabah Electricity">
  <div data-theme-toggle></div>
</div></header>
<div class="wrap">
  <section class="hero"><h1 id="title">Mobile Legends</h1><p id="sub">E-Sport HQ Championship · updates automatically — no need to refresh.</p><span class="pill" id="prog" hidden></span></section>
  <nav id="tabs"></nav>
  <main>
    <div class="sub" id="subtabs">
      <button data-v="table" class="on">Standings</button>
      <button data-v="matches">Matches</button>
      <button data-v="playoffs">Semi &amp; Final</button>
    </div>
    <div class="upd" id="upd"></div>
    <div id="body"><div class="empty">Loading…</div></div>
  </main>
</div>
<footer class="jafoot"><span class="jamark"></span>Powered by JUJI-ATELIER</footer>
<script type="module">
const ML_VENUE = "Centralized Meeting Room, Block E, Tingkat 1, Bangunan KWSP";
// Mobile Legends standings for the HQ Games live page.
// Data: Firebase  mlbb/live  — written by the JA ESPORT console (Group Stage tab).
import { firebaseConfig, SPORTS, EVENT_DEFAULTS } from "./config.js?v=20261113k";
import { renderSportGrid, sportItems, fetchLiveCounts } from "./js/sportnav.js?v=20261113k";
import { cfgOf, shown, isDone, mlHas, mlEffective, KEEP } from "./js/livecfg.js?v=20261113k";
const BASE = String(firebaseConfig.databaseURL || "").replace(/\/$/, "");
const POLL_MS = 12000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEMO = new URLSearchParams(location.search).has("demo");
let D = null, lastOk = 0, timer = null;
let cfg = { show: {}, done: {} }, kept = false;   // Admin → Live score settings; kept = showing the saved copy
let sub = (() => { try { return sessionStorage.getItem("mlbbSub") || "table"; } catch (e) { return "table"; } })();

let boardNames = {};
const bname = (id, d) => String((boardNames[id] || {}).name || "").trim() || d;
let liveCounts = {};
const sportTabs = () => {
  renderSportGrid($("#tabs"), sportItems(SPORTS, id => id === "bowling" ? "bowling.html" : id === "mlbb" ? "mlbb.html" : "live/#" + id,
    { bowling: bname("bowling", "Bowling"), mlbb: bname("mlbb", "Mobile Legends") }, liveCounts, cfg), "mlbb");
  const t = document.getElementById("title"); if (t) t.textContent = bname("mlbb", "Mobile Legends"); };
sportTabs();
{ const base = String(firebaseConfig.databaseURL || "").replace(/\/$/, "");
  const lc = () => fetchLiveCounts(base, Object.keys(SPORTS), cfg).then(c => { liveCounts = c; sportTabs(); }).catch(() => {});
  setTimeout(lc, 1500); setInterval(() => { if (!document.hidden) lc(); }, 60000); }

function setSub(v) {
  sub = v; try { sessionStorage.setItem("mlbbSub", v); } catch (e) {}
  document.querySelectorAll("#subtabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  render();
}
document.querySelectorAll("#subtabs button").forEach(b => b.onclick = () => setSub(b.dataset.v));
setSub(sub);

async function getJSON(path) {
  const r = await fetch(`${BASE}/${path}.json`, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
let settingsAt = 0;
async function poll() {
  clearTimeout(timer);
  if (document.hidden) return;
  try {
    if (Date.now() - settingsAt > 60000) {
      const s = (await getJSON("settings").catch(() => null)) || {};
      settingsAt = Date.now();
      cfg = cfgOf(s);
      // switched off in Admin → Live score: send people to the main live-score page
      if (!DEMO && !shown(cfg, "mlbb")) { location.replace("live/"); return; }
      for (const [id, o] of Object.entries(s.sportInfo || {})) if (SPORTS[id] && o && String(o.name || "").trim()) SPORTS[id].name = String(o.name).trim();
      boardNames = s.sportInfo || {};
      sportTabs();
      $("#ev").textContent = s.event || EVENT_DEFAULTS.name;
      // Mobile Legends' own date / venue (Admin → Sport names, dates & venues); not the main venue
      // default: same room as Karom (where the ML games were played)
      const mi = (s.sportInfo || {}).mlbb || {}, mv = String(mi.venue || "").trim() || ML_VENUE, md = String(mi.day || "").trim();
      $("#venue").textContent = mv ? `📍 ${mv}${md ? " · " + md : ""}` : `Mobile Legends · E-Sport${md ? " · " + md : ""}`;
    }
    if (DEMO) { D = demo(); kept = false; }
    else {
      // Completed → the kept copy only. Otherwise the console's data; if the console was
      // cleared, the copy Admin kept (only "Reset live score system" removes it).
      const done = isDone(cfg, "mlbb");
      const live = done ? null : await getJSON("mlbb/live");
      const keep = done || !mlHas(live) ? await getJSON(`pub/${KEEP}/mlbb`).catch(() => null) : null;
      const e = mlEffective(live, keep, cfg);
      D = done && !e.D ? await getJSON("mlbb/live") : e.D;
      kept = e.kept;
    }
    lastOk = Date.now(); render();
  } catch (e) { $("#upd").textContent = "Connection problem – retrying…"; }
  timer = setTimeout(poll, POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

const sgn = n => (n > 0 ? "+" : "") + n;
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
const logo = u => u ? `<img class="lg" src="${esc(u)}" alt="" loading="lazy">` : "";

function table(G, rows, q, nRounds, pend) {
  if (!rows || !rows.length) return "";
  const n = rows.length;
  if (pend) q = 0;
  return `<h2><span class="gtag" style="background:var(--g${G.toLowerCase()})">GROUP ${G}</span> ${n} teams${pend ? ` <span class="pend">⚖ Pending · organiser decision</span>` : ""}</h2>
  <div class="tw ${G}"><table><tr><th>#</th><th class="t">Team</th><th class="hide-s">Form</th><th>P</th><th>W</th><th>L</th><th>KD</th><th class="hide-s">Kill</th><th>Pts</th></tr>` +
  rows.map((t, i) => {
    const f = (t.form || []).slice(0, nRounds || 7);
    return `<tr class="${i < q ? "q" : ""} ${i === q - 1 && q < n ? "cut" : ""}"><td class="rk">${i + 1}</td>
    <td class="t"><div class="tc"><span class="slot">${esc(t.slot || "")}</span>${logo(t.logo)}<span class="nm">${esc(t.name)}</span></div></td>
    <td class="hide-s"><span class="form">${f.map(x => `<i class="${esc(x)}"></i>`).join("")}</span></td>
    <td>${t.p | 0}</td><td>${t.w | 0}</td><td>${t.l | 0}</td><td class="${cls(t.kd | 0)}">${sgn(t.kd | 0)}</td><td class="hide-s">${t.kills | 0}</td><td class="pts"><b>${t.pts | 0}</b></td></tr>`;
  }).join("") + `</table></div>`;
}

function side(x, w, me) {
  const won = w === me;
  return `<div class="r ${won ? "win" : ""}"><span class="sl ${esc((x.slot || "")[0] || "")}">${esc(x.slot || "")}</span>
    <span class="n">${logo(x.logo)}${esc(x.name || "TBC")}</span>
    <span class="b">${x.score ?? ""}${x.kills != null && x.score == null ? `<span class="k">${x.kills} K</span>` : ""}</span></div>`;
}
function mcard(m, label, onStream) {
  const st = m.st === "live" ? "Live" : m.st === "done" ? (m.wo ? "Walkover" : "Final") : "Up next";
  if (onStream && m.st !== "done") label = (label ? label + " " : "") + '<span class="lvtag">● ON STREAM</span>';
  const hid = x => m.st === "scheduled" ? { ...x, score: null } : x;
  return `<div class="m ${m.st === "live" ? "live" : ""}"><div class="meta">${label ? `<span>${label}</span>` : ""}<span class="st">${st}</span></div>${side(hid(m.a || {}), m.w, "a")}${side(hid(m.b || {}), m.w, "b")}</div>`;
}

function render() {
  if (!lastOk) return;
  if (!D) { $("#body").innerHTML = `<div class="empty">Mobile Legends standings are not published yet.</div>`; $("#prog").hidden = true; tick(); return; }
  const rd = D.round || {};
  $("#prog").hidden = !rd.total;
  $("#prog").textContent = rd.done >= rd.total ? "Group stage complete" : `Group stage · Round ${rd.done || 0} / ${rd.total} done`;
  if (D.event) $("#sub").textContent = D.event + " · updates automatically — no need to refresh.";
  let h = "";
  const q = D.qualify || 2;
  if (sub === "table") {
    const g = D.groups || {};
    const rv = D.review || {};
    h += table("A", g.A, q, rd.total, rv.A) + table("B", g.B, q, rd.total, rv.B);
    if (rv.A || rv.B) h = `<div class="pendbox">⚖ <b>Group ${[rv.A && "A", rv.B && "B"].filter(Boolean).join(" & ")}: result pending.</b> The organiser is deciding who goes to the semi-final. This page updates once it is decided.</div>` + h;
    if (!g.A && !g.B) h += `<div class="empty">No standings yet.</div>`;
    else h += `<div class="key"><span>Win 3 pts · Loss 0 · Walkover loss 0</span><span>★ Top ${q} of each group → Semi-final</span><span>Ties: Pts › Wins › Kill diff › Kills</span></div>`;
  } else if (sub === "matches") {
    const rs = D.rounds || [];
    if (!rs.length) h += `<div class="empty">No matches published yet.</div>`;
    rs.slice().sort((a, b) => b.no - a.no).forEach(r => {
      h += `<h2>Round ${r.no}${r.no === rd.next ? " · up next" : ""}</h2>` + (r.matches || []).map((m, i) => mcard(m, "Match " + (i + 1))).join("");
    });
  } else {
    const p = D.playoffs || {};
    if (p.champion) h += `<div class="champ"><div class="k">🏆 Mobile Legends · Champion</div><div class="w">${esc(p.champion)}</div><div class="o">${p.runner ? `<span>🥈 Runner-up: ${esc(p.runner)}</span>` : ""}${p.third ? `<span>🥉 3rd: ${esc(p.third)}</span>` : ""}</div></div>`;
    const list = [...(p.semis || []).map((m, i) => [m, "Semi-final " + (i + 1)]), ...(p.third_m ? [[p.third_m, "3rd place"]] : []), ...(p.final ? [[p.final, "Final"]] : [])];
    if (!list.length) h += `<div class="empty">Semi-finals start after the group stage. Top ${q} of each group go through.</div>`;
    else {
      const SW = D.stream || { final: true };
      if (p.final) h += `<h2>Final</h2>` + mcard(p.final, p.final.bo ? "Best of " + p.final.bo : "", SW.final);
      if (p.third_m) h += `<h2>3rd place</h2>` + mcard(p.third_m, "", SW.third);
      if ((p.semis || []).length) h += `<h2>Semi-finals</h2>` + p.semis.map((m, i) => mcard(m, "Semi " + (i + 1) + (m.bo ? " · Best of " + m.bo : ""), SW["sf" + (i + 1)])).join("");
    }
  }
  const SW2 = D.stream || {}, onAir = ["sf1", "sf2", "third", "final"].filter(k => SW2[k]);
  if (onAir.length && !(D.playoffs || {}).champion) {
    const nm = { sf1: "Semi-final 1", sf2: "Semi-final 2", third: "3rd place", final: "Final" }, list = onAir.map(k => nm[k]).join(", ").replace(/, ([^,]*)$/, " & $1");
    const L = String(D.streamLink || "").trim(), url = /^https?:\/\//i.test(L) ? L : (L ? "https://" + L : "");
    h = `<div class="live-ann"><span class="ai">📺</span><div><b>${esc(list)} — live on stream</b>` +
      (url ? `<small>Watch the livestream:</small><a href="${esc(url)}" target="_blank" rel="noopener">▶ ${esc(L.replace(/^https?:\/\/(www\.)?/i, ""))}</a>` : `<small>The organiser will announce the livestream link.</small>`) + `</div></div>` + h;
  }
  if (isDone(cfg, "mlbb")) h = `<div class="donebar">✅ <b>${esc(bname("mlbb", "Mobile Legends"))} completed</b> · final results</div>` + h;
  $("#body").innerHTML = h;
  tick();
}
function tick() {
  if (!lastOk) return;
  const s = Math.round((Date.now() - lastOk) / 1000);
  const at = D && D.at ? new Date(D.at).toLocaleTimeString("en-MY", { hour: "numeric", minute: "2-digit" }) : "";
  $("#upd").textContent = (at ? `Last update ${at} · ` : "") + "checked " + (s < 5 ? "just now" : s < 60 ? `${s}s ago` : `${Math.round(s / 60)} min ago`);
}
